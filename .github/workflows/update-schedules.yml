name: Update TV schedules

on:
  schedule:
    - cron: "0 * * * *"   # כל שעה
  workflow_dispatch:         # הרצה ידנית מכפתור ב-GitHub

# הרשאות: כתיבה לריפו (קומיט נתונים) + פרסום ל-GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch schedules
        run: node scripts/fetch-schedules.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore: refresh TV schedules [skip ci]"
            git push
          else
            echo "No schedule changes."
          fi

      # פרסום ישיר ל-GitHub Pages בכל ריצה — כך האתר תמיד מציג את הנתונים הטריים,
      # ללא תלות בענף או בטריגרים של push. (דורש Settings → Pages → Source: GitHub Actions)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
