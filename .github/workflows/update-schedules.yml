name: Update TV schedules

on:
  schedule:
    - cron: "0 * * * *"   # כל שעה
  workflow_dispatch:         # הרצה ידנית מכפתור ב-GitHub

permissions:
  contents: write

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch schedules
        run: node scripts/fetch-schedules.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore: refresh TV schedules [skip ci]"
            git push
          else
            echo "No schedule changes."
          fi
