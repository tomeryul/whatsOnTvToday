<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>מה עכשיו בטלוויזיה · 12 / 13 / 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#141414; --card:#1c1c1c; --red:#e50914; --ink:#fff; --muted:#b3b3b3; --line:#2a2a2a; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,sans-serif;
    min-height:100vh;line-height:1.4;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 4vw;background:linear-gradient(180deg,#141414 30%,rgba(20,20,20,.85));border-bottom:1px solid var(--line)}
  .brand{color:var(--red);font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip-toggle{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;cursor:pointer;
    font-weight:700;font-size:14px;user-select:none;border:1px solid var(--line);background:#1c1c1c;color:var(--muted);transition:.15s}
  .chip-toggle .swatch{width:10px;height:10px;border-radius:50%}
  .chip-toggle.on{color:#fff;background:#2a2a2a;border-color:#444}
  .chip-toggle.off{opacity:.45}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .who b{color:#fff}
  .who .lnk{cursor:pointer;text-decoration:underline}
  .who .lnk:hover{color:#fff}
  .avatar{width:24px;height:24px;border-radius:50%;object-fit:cover}
  .gbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;color:#1a1a1a;border:none;border-radius:8px;
    padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer}
  .gbtn:hover{filter:brightness(.93)}
  .gbtn .g{color:#4285F4;font-weight:900;font-size:15px}
  .updated{color:#777;font-size:12px;white-space:nowrap}
  .icon-btn{background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;width:38px;height:38px;
    border-radius:50%;font-size:18px;transition:.15s}
  .icon-btn:hover{background:rgba(255,255,255,.22)}
  .icon-btn:disabled{opacity:.4;cursor:default}
  .icon-btn.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #status{padding:0 4vw;font-size:14px;color:var(--muted)}
  #status.show{padding:16px 4vw}
  #status.err{color:#ff6b6b}

  #output{padding:8px 4vw 60px}
  .section{margin:14px 0 28px}
  .section > h2{font-size:clamp(18px,2.6vw,24px);font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .section > h2 .sub{color:var(--muted);font-weight:600;font-size:14px}
  .live-dot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
  .star{color:var(--accent,#ffd166)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,9,20,.6)}70%{box-shadow:0 0 0 8px rgba(229,9,20,0)}100%{box-shadow:0 0 0 0 rgba(229,9,20,0)}}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

  .pcard{display:flex;background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;
    transition:transform .18s ease, background .18s ease;border:1px solid #242424}
  .pcard:hover{transform:translateY(-3px);background:#242424}
  .pcard .pthumb{width:118px;min-width:118px;height:104px;object-fit:cover;background:#222;display:block}
  .pcard .pinfo{padding:10px 12px;min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
  .prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;line-height:1.6}
  .ptime{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:#fff}
  .ptime .day{color:var(--muted);font-weight:600;font-size:12px}
  .nowtag{color:var(--red);font-weight:800;font-size:12px;display:flex;align-items:center;gap:4px}
  .nowtag .d{width:7px;height:7px;border-radius:50%;background:var(--red)}
  .ptitle{font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pdesc{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .pcard.live{border-color:var(--red)}
  .pprogress{position:absolute;bottom:0;right:0;height:3px;background:var(--red)}
  .scard{cursor:default}
  .scard:hover{transform:none;background:var(--card)}
  .sport-chip{background:#1f7a4d;color:#eafff3}
  .sport-thumb{display:flex;align-items:center;justify-content:center;font-size:34px;background:#14241c}
  .livetag{color:#ff8a3d;font-weight:800;font-size:12px}
  .pmeta{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:2px}
  .likebtn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--muted);
    cursor:pointer;font-size:13px;font-weight:700;padding:2px 0}
  .likebtn .hrt{font-size:15px;line-height:1}
  .likebtn.liked{color:var(--red)}
  .likebtn:hover{color:#fff}
  .cmeta{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;font-weight:700}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-overlay.open{display:flex}
  .modal{background:#181818;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.7);animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
  .modal .mimg{width:100%;height:260px;object-fit:cover;display:block;background:#222;border-radius:12px 12px 0 0}
  .modal .mclose{position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.65);
    color:#fff;border:none;font-size:20px;cursor:pointer;line-height:1}
  .modal .mclose:hover{background:#000}
  .modal .mbody{padding:18px 26px 26px}
  .modal .mchip{font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px}
  .modal h2{margin:12px 0 8px;font-size:25px;font-weight:900;line-height:1.1}
  .modal .mmeta{color:var(--muted);font-weight:600;margin-bottom:14px;font-size:15px}
  .modal .mmeta b{color:#fff}
  .modal .mdesc{color:#dcdcdc;font-size:15px;line-height:1.6}
  .modal .mactions{display:flex;gap:12px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
  .biglike{display:inline-flex;align-items:center;gap:8px;background:#262626;border:1px solid #3a3a3a;color:#fff;
    font-weight:800;font-size:15px;padding:9px 18px;border-radius:8px;cursor:pointer;transition:.15s}
  .biglike:hover{background:#303030}
  .biglike.liked{background:rgba(229,9,20,.18);border-color:var(--red);color:#ff7a70}
  .biglike .hrt{font-size:18px}
  .mlink{display:inline-block;background:var(--red);color:#fff;font-weight:800;padding:10px 20px;border-radius:8px}
  .mlink:hover{filter:brightness(1.1)}

  /* comments */
  .comments{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
  .comments h3{margin:0 0 12px;font-size:17px;font-weight:800}
  .cbox{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .cbox textarea{width:100%;min-height:64px;resize:vertical;background:#222;border:1px solid var(--line);color:#fff;
    border-radius:8px;padding:10px 12px;font:inherit;font-size:14px}
  .cbox .crow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cbox .as{color:var(--muted);font-size:12.5px}
  .cbox .as b{color:#fff}
  .cbox .as u{cursor:pointer}
  .send{background:var(--red);color:#fff;border:none;font-weight:800;padding:9px 18px;border-radius:8px;cursor:pointer}
  .send:disabled{opacity:.5;cursor:default}
  .clist{display:flex;flex-direction:column;gap:12px}
  .citem{background:#1f1f1f;border-radius:8px;padding:10px 13px}
  .citem .ch{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
  .citem .cn{font-weight:800;font-size:13.5px}
  .citem .ct{color:#666;font-size:11.5px;white-space:nowrap}
  .citem .cx{font-size:14px;color:#e0e0e0;white-space:pre-wrap;word-break:break-word}
  .cempty{color:#777;font-size:13.5px}
  .cdisabled{color:#888;font-size:13px;line-height:1.6}

  /* nickname dialog */
  .nick-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:120;padding:20px}
  .nick-overlay.open{display:flex}
  .nick{background:#1c1c1c;border-radius:12px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .nick h3{margin:0 0 6px;font-size:20px;font-weight:900}
  .nick p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .nick input{width:100%;background:#222;border:1px solid var(--line);color:#fff;border-radius:8px;padding:11px 12px;font:inherit;font-size:15px;margin-bottom:14px}
  .nick .nbtns{display:flex;gap:10px;justify-content:flex-end}
  .nick button{border:none;border-radius:8px;padding:9px 18px;font-weight:800;cursor:pointer}
  .nick .save{background:var(--red);color:#fff}
  .nick .cancel{background:#2a2a2a;color:#ccc}

  footer{margin-top:20px;color:#777;font-size:12px;text-align:center;line-height:1.7;padding:0 18px 30px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">מה עכשיו בטלוויזיה</div>
    <div class="chips" id="chips"></div>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <span class="updated" id="updated"></span>
    <button class="icon-btn" id="loadBtn" title="רענן">&#x21bb;</button>
  </div>

  <div id="status"></div>
  <div id="output"></div>

  <footer>
    כל הערוצים בדף אחד · עכשיו בשידור ו-24 השעות הקרובות · נתונים נמשכים בצד-שרת (GitHub Action).
  </footer>

  <!-- program / series modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="mclose" id="modalClose" title="סגור">&times;</button>
      <img class="mimg" id="modalImg" alt="" onerror="this.style.display='none'">
      <div class="mbody">
        <span class="mchip" id="modalChip"></span>
        <h2 id="modalTitle"></h2>
        <div class="mmeta" id="modalMeta"></div>
        <div class="mdesc" id="modalDesc"></div>
        <div class="mactions" id="modalActions"></div>
        <div class="comments" id="commentsBox"></div>
      </div>
    </div>
  </div>

  <!-- nickname dialog -->
  <div class="nick-overlay" id="nickModal">
    <div class="nick">
      <h3>איך לקרוא לך?</h3>
      <p>הכינוי יוצג ליד הלייקים והתגובות שלך.</p>
      <input id="nickInput" maxlength="24" placeholder="הכינוי שלך">
      <div class="nbtns">
        <button class="cancel" id="nickCancel">ביטול</button>
        <button class="save" id="nickSave">שמירה</button>
      </div>
    </div>
  </div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";

/* ===== מניעת זום לחלוטין (pinch / double-tap / ctrl+wheel / ctrl±) ===== */
["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
document.addEventListener("wheel", e => { if(e.ctrlKey) e.preventDefault(); }, { passive:false });
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault();
});
let _lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if(now - _lastTouchEnd <= 300) e.preventDefault(); // חוסם double-tap zoom
  _lastTouchEnd = now;
}, { passive:false });

/* ============ schedule data + UI ============ */
const CH = {
  reshet13: { id:"reshet13", file:"data/reshet13.json", name:"רשת 13", color:"#e50914", text:"#fff" },
  keshet12: { id:"keshet12", file:"data/keshet12.json", name:"קשת 12", color:"#3fd6c0", text:"#04201c" },
  kan11:    { id:"kan11",    file:"data/kan11.json",    name:"כאן 11", color:"#4da3ff", text:"#06182e" }
};
const ORDER = ["reshet13","keshet12","kan11"];
const HOUR = 3600e3, WINDOW = 24*HOUR, DEFAULT_LEN = 90*60e3;

let allPrograms = [], windowed = [], primeList = [], sportPrograms = [];
const active = new Set(ORDER);
let currentModal = null;        // {key,title,ch,img,desc,start,end,link}

const $ = s => document.querySelector(s);
const statusEl = $("#status"), outEl = $("#output"), updatedEl = $("#updated");

function setStatus(msg, isErr){
  statusEl.textContent = msg || "";
  statusEl.className = (msg ? "show " : "") + (isErr ? "err" : "");
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function seriesKey(title){ return String(title).trim().replace(/\s+/g," ").replace(/\//g," ").slice(0,300); }

function relativeTime(ms){
  const mins = Math.round((Date.now() - ms) / 60000);
  if(isNaN(mins)) return "";
  if(mins < 1) return "עכשיו";
  if(mins < 60) return `לפני ${mins} ד׳`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `לפני ${hrs} ש׳`;
  return `לפני ${Math.round(hrs/24)} ימים`;
}
function timeLabel(start){
  const d = new Date(start), now = new Date();
  const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((dDay - day0) / 86400e3);
  const hhmm = new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  return { prefix: diff <= 0 ? "" : diff === 1 ? "מחר " : "", hhmm };
}

async function loadAll(){
  const btn = $("#loadBtn");
  btn.disabled = true; btn.classList.add("spin");
  setStatus("טוען לוח שידורים…");
  try {
    const loaded = await Promise.all(ORDER.map(async id => {
      try { const r = await fetch(CH[id].file + "?t=" + Date.now()); return r.ok ? await r.json() : null; }
      catch { return null; }
    }));
    // ספורט — קובץ נפרד (כל ערוצי ספורט 5 / ONE)
    const sportJson = await fetch("data/sport.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
    sportPrograms = (sportJson && sportJson.programs) ? sportJson.programs.slice().sort((a,b)=>a.start-b.start) : [];
    allPrograms = []; let oldest = null;
    loaded.forEach((json, i) => {
      if(!json || !json.programs) return;
      const id = ORDER[i];
      const progs = json.programs.slice().sort((a,b)=>a.start-b.start);
      progs.forEach((p, idx) => {
        allPrograms.push({ ...p, ch:id, key:seriesKey(p.title),
          end: progs[idx+1] ? progs[idx+1].start : p.start + DEFAULT_LEN });
      });
      const u = json.updated ? Date.parse(json.updated) : null;
      if(u && (!oldest || u < oldest)) oldest = u;
    });
    if(!allPrograms.length){
      setStatus("אין נתונים זמינים. ייתכן שה-GitHub Action עוד לא יצר את הקבצים.", true);
    } else {
      setStatus("");
      updatedEl.textContent = oldest ? "עודכן " + relativeTime(oldest) : "";
      renderView();
    }
  } catch(e){ setStatus("שגיאה בטעינה: " + e.message, true); }
  btn.disabled = false; btn.classList.remove("spin");
}

function chip(id){ const c = CH[id]; return `<span class="chip" style="background:${c.color};color:${c.text}">${esc(c.name)}</span>`; }

function likeMetaHtml(key){
  if(!SOCIAL) return "";
  const agg = likesMap.get(key) || {};
  const liked = likedSet.has(key);
  return `<div class="pmeta">
    <button class="likebtn${liked?" liked":""}" data-like="${esc(key)}">
      <span class="hrt">${liked?"♥":"♡"}</span><span class="cnt">${agg.likes||0}</span>
    </button>
    <span class="cmeta">💬 <span>${agg.comments||0}</span></span>
  </div>`;
}

function pcard(p, idx){
  const isLive = p.start <= Date.now() && p.end > Date.now();
  const { prefix, hhmm } = timeLabel(p.start);
  let progress = "";
  if(isLive){
    const pct = Math.min(100, Math.max(0, (Date.now()-p.start)/(p.end-p.start)*100));
    progress = `<span class="pprogress" style="width:${pct}%"></span>`;
  }
  return `<div class="pcard${isLive?" live":""}" data-idx="${idx}">
    ${p.img ? `<img class="pthumb" src="${esc(p.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="pthumb"></span>`}
    <div class="pinfo">
      <div class="prow">
        ${chip(p.ch)}
        <span class="ptime">${prefix?`<span class="day">${prefix}</span>`:""}${hhmm}</span>
        ${isLive?`<span class="nowtag"><span class="d"></span>עכשיו</span>`:""}
      </div>
      <div class="ptitle">${esc(p.title)}</div>
      ${p.desc?`<div class="pdesc">${esc(p.desc)}</div>`:""}
      ${likeMetaHtml(p.key)}
    </div>
    ${progress}
  </div>`;
}

function topCard(s){
  return `<div class="pcard" data-top="${esc(s.key)}">
    ${s.img ? `<img class="pthumb" src="${esc(s.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="pthumb"></span>`}
    <div class="pinfo">
      <div class="prow">${chip(s.channel)}<span class="cmeta">💬 ${s.comments||0}</span></div>
      <div class="ptitle">${esc(s.title)}</div>
      <div class="pmeta"><span class="likebtn liked"><span class="hrt">♥</span><span>${s.likes||0}</span></span></div>
    </div>
  </div>`;
}

// יעד "פריים טיים" — ה-21:40 הקרוב (היום אם עוד לא עבר, אחרת מחר)
const PRIME_H = 21, PRIME_M = 40;
function nextPrimeTarget(){
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), PRIME_H, PRIME_M, 0, 0);
  if(now.getTime() >= t.getTime()) t.setDate(t.getDate() + 1);
  return t.getTime();
}
function primeCard(p, idx, prefix){
  return `<div class="pcard" data-prime="${idx}">
    ${p.img ? `<img class="pthumb" src="${esc(p.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="pthumb"></span>`}
    <div class="pinfo">
      <div class="prow">${chip(p.ch)}<span class="ptime"><span class="day">${prefix}</span>21:40</span></div>
      <div class="ptitle">${esc(p.title)}</div>
      ${p.desc ? `<div class="pdesc">${esc(p.desc)}</div>` : ""}
      ${likeMetaHtml(p.key)}
    </div>
  </div>`;
}

// כרטיס ספורט (תצוגה בלבד — בלי מודאל/לייקים)
function sportCard(p){
  const { prefix, hhmm } = timeLabel(p.start);
  const liveNow = p.start <= Date.now() && p.start + 150*60e3 > Date.now();
  return `<div class="pcard scard">
    <span class="pthumb sport-thumb">🏅</span>
    <div class="pinfo">
      <div class="prow">
        <span class="chip sport-chip">${esc(p.channel)}</span>
        <span class="ptime">${prefix?`<span class="day">${prefix}</span>`:""}${hhmm}</span>
        ${liveNow ? `<span class="nowtag"><span class="d"></span>עכשיו</span>`
          : (p.live ? `<span class="livetag">● ישיר</span>` : "")}
      </div>
      <div class="ptitle">${esc(p.title)}</div>
    </div>
  </div>`;
}

function renderView(){
  const now = Date.now(), horizon = now + WINDOW;
  windowed = allPrograms.filter(p => active.has(p.ch) && p.end > now && p.start <= horizon)
                        .sort((a,b)=>a.start-b.start);
  if(!windowed.length){
    outEl.innerHTML = `<p style="color:#888;padding:30px 0">אין תוכניות להצגה (בדוק שהערוצים מסומנים למעלה).</p>`;
    return;
  }
  const live = [], upcoming = [];
  windowed.forEach((p, idx) => (p.start <= now ? live : upcoming).push(idx));

  // מה בערב — איזו תוכנית משודרת בכל ערוץ ב-21:40 הקרוב
  const target = nextPrimeTarget();
  const primePrefix = new Date(target).toDateString() === new Date().toDateString() ? "היום " : "מחר ";
  primeList = ORDER.filter(id => active.has(id))
    .map(id => allPrograms.find(p => p.ch === id && p.start <= target && p.end > target))
    .filter(Boolean);

  let html = "";
  if(live.length){
    html += `<div class="section"><h2><span class="live-dot"></span>עכשיו בשידור</h2>
      <div class="grid">${live.map(i=>pcard(windowed[i],i)).join("")}</div></div>`;
  }
  if(primeList.length){
    html += `<div class="section"><h2>🌙 מה בערב <span class="sub">· ${primePrefix.trim()} 21:40</span></h2>
      <div class="grid">${primeList.map((p,i)=>primeCard(p,i,primePrefix)).join("")}</div></div>`;
  }
  // ספורט — שידורים חיים מעכשיו ול-24 השעות הקרובות, מכל ערוצי ספורט 5/ONE
  const sportNow = sportPrograms
    .filter(p => p.start + 150*60e3 > now && p.start <= horizon)
    .sort((a,b)=>a.start-b.start);
  if(sportNow.length){
    html += `<div class="section"><h2>🏆 ספורט <span class="sub">· שידורים חיים</span></h2>
      <div class="grid">${sportNow.map(sportCard).join("")}</div></div>`;
  }
  if(SOCIAL && topList.length){
    html += `<div class="section"><h2><span class="star">★</span>הכי אהובים <span class="sub">· לפי המשתמשים</span></h2>
      <div class="grid">${topList.slice(0,12).map(topCard).join("")}</div></div>`;
  }
  if(upcoming.length){
    html += `<div class="section"><h2>בהמשך <span class="sub">· 24 השעות הקרובות</span></h2>
      <div class="grid">${upcoming.map(i=>pcard(windowed[i],i)).join("")}</div></div>`;
  }
  outEl.innerHTML = html;
}

/* clicks: like buttons, top cards, program cards */
outEl.addEventListener("click", e => {
  const likeEl = e.target.closest(".likebtn[data-like]");
  if(likeEl){ e.stopPropagation(); toggleLike(likeEl.dataset.like); return; }
  const top = e.target.closest("[data-top]");
  if(top){ const s = topList.find(x=>x.key===top.dataset.top);
    if(s) openModal({ key:s.key, title:s.title, ch:s.channel, img:s.img, desc:"", start:null, end:null, link:null }); return; }
  const prime = e.target.closest("[data-prime]");
  if(prime){ const p = primeList[+prime.dataset.prime];
    if(p) openModal({ key:p.key, title:p.title, ch:p.ch, img:p.img, desc:p.desc, start:p.start, end:p.end, link:p.link }); return; }
  const card = e.target.closest(".pcard[data-idx]");
  if(card){ const p = windowed[+card.dataset.idx];
    openModal({ key:p.key, title:p.title, ch:p.ch, img:p.img, desc:p.desc, start:p.start, end:p.end, link:p.link }); }
});

/* ============ modal ============ */
function openModal(p){
  currentModal = p;
  const c = CH[p.ch];
  const chipEl = $("#modalChip");
  chipEl.textContent = c.name; chipEl.style.background = c.color; chipEl.style.color = c.text;
  $("#modalTitle").textContent = p.title;
  if(p.start){
    const { prefix, hhmm } = timeLabel(p.start);
    const endTxt = new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(p.end));
    $("#modalMeta").innerHTML = `<b>${prefix}${hhmm}–${endTxt}</b> · ${esc(c.name)}`;
  } else { $("#modalMeta").innerHTML = esc(c.name); }
  $("#modalDesc").textContent = p.desc || "אין תיאור זמין לתוכנית זו.";
  const img = $("#modalImg");
  if(p.img){ img.src = p.img; img.style.display = ""; } else { img.removeAttribute("src"); img.style.display = "none"; }

  // actions: like + link
  const acts = $("#modalActions");
  const agg = likesMap.get(p.key) || {};
  const liked = likedSet.has(p.key);
  let actHtml = "";
  if(SOCIAL){
    actHtml += `<button class="biglike${liked?" liked":""}" id="mLike">
      <span class="hrt">${liked?"♥":"♡"}</span><span id="mLikeCnt">${agg.likes||0}</span> לייקים</button>`;
  }
  if(p.link) actHtml += `<a class="mlink" href="${esc(p.link)}" target="_blank" rel="noopener">לעמוד התוכנית ↗</a>`;
  acts.innerHTML = actHtml;
  if(SOCIAL) $("#mLike").onclick = () => toggleLike(p.key);

  renderComments();
  $("#modal").classList.add("open");
}
function closeModal(){
  if(unsubComments){ unsubComments(); unsubComments = null; }
  currentModal = null;
  $("#modal").classList.remove("open");
}
$("#modalClose").onclick = closeModal;
$("#modal").onclick = e => { if(e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeModal(); closeNick(false); } });

/* ============ channel chips ============ */
function buildChips(){
  $("#chips").innerHTML = ORDER.map(id => {
    const c = CH[id];
    return `<div class="chip-toggle on" data-ch="${id}"><span class="swatch" style="background:${c.color}"></span>${esc(c.name)}</div>`;
  }).join("");
  $("#chips").querySelectorAll(".chip-toggle").forEach(el => el.onclick = () => {
    const id = el.dataset.ch;
    if(active.has(id) && active.size === 1) return;
    if(active.has(id)){ active.delete(id); el.classList.replace("on","off"); }
    else { active.add(id); el.classList.replace("off","on"); }
    renderView();
  });
}

$("#loadBtn").onclick = loadAll;
buildChips();
loadAll();
setInterval(() => { if(allPrograms.length) renderView(); }, 60000);

/* ============================================================
   SOCIAL — Firebase (משתמשים אנונימיים, כינוי, לייקים, תגובות)
   ============================================================ */
const SOCIAL = !!(firebaseConfig && firebaseConfig.apiKey);
let db = null, uid = null, FS = null, AUTH = null, auth = null, currentUser = null;
let likesMap = new Map();          // key -> {likes, comments, ...}
let topList = [];                  // series sorted by likes desc
let likedSet = new Set(JSON.parse(localStorage.getItem("likedKeys") || "[]"));
let nickname = localStorage.getItem("nickname") || "";
let unsubComments = null;

function saveLiked(){ localStorage.setItem("likedKeys", JSON.stringify([...likedSet])); }

function updateWho(){
  const el = $("#who");
  if(!SOCIAL){ el.textContent = ""; return; }
  if(currentUser){
    const name = esc(nickname || currentUser.displayName || "משתמש");
    el.innerHTML = `${currentUser.photoURL ? `<img class="avatar" src="${esc(currentUser.photoURL)}" alt="">` : ""}<b>${name}</b> · <u class="lnk" id="renameBtn">שם</u> · <u class="lnk" id="logoutBtn">יציאה</u>`;
    $("#renameBtn").onclick = () => askNickname(true);
    $("#logoutBtn").onclick = () => signOutUser();
  } else {
    el.innerHTML = `<button class="gbtn" id="gLogin"><span class="g">G</span> התחבר עם Google</button>`;
    $("#gLogin").onclick = () => signInGoogle();
  }
}

/* nickname dialog */
let nickResolve = null;
function askNickname(force){
  return new Promise(resolve => {
    if(nickname && !force){ resolve(nickname); return; }
    nickResolve = resolve;
    $("#nickInput").value = nickname || "";
    $("#nickModal").classList.add("open");
    setTimeout(()=>$("#nickInput").focus(), 50);
  });
}
function closeNick(saved){
  $("#nickModal").classList.remove("open");
  const r = nickResolve; nickResolve = null;
  if(r) r(saved ? nickname : (nickname || null));
}
$("#nickSave").onclick = () => {
  const v = $("#nickInput").value.trim().slice(0,24);
  if(!v) return;
  nickname = v; localStorage.setItem("nickname", v); updateWho(); updateCAs(); closeNick(true);
};
$("#nickCancel").onclick = () => closeNick(false);
$("#nickInput").addEventListener("keydown", e => { if(e.key === "Enter") $("#nickSave").click(); });

async function signInGoogle(){
  if(!auth || !AUTH) return false;
  const provider = new AUTH.GoogleAuthProvider();
  try {
    await AUTH.signInWithPopup(auth, provider);
    uid = auth.currentUser && auth.currentUser.uid;
    return true;
  } catch(e){
    // במובייל/חוסם-חלונות — נופלים להפניה (redirect)
    if(["auth/popup-blocked","auth/cancelled-popup-request","auth/popup-closed-by-user","auth/operation-not-supported-in-this-environment"].includes(e.code)){
      try { await AUTH.signInWithRedirect(auth, provider); } catch(_){}
    } else { console.warn("signIn:", e); alert("ההתחברות נכשלה: " + (e.code || e.message)); }
    return false;
  }
}
function signOutUser(){ if(auth && AUTH) AUTH.signOut(auth); }
async function ensureSignedIn(){ return currentUser ? true : await signInGoogle(); }

async function initSocial(){
  if(!SOCIAL){ updateWho(); return; }
  updateWho();
  try {
    const [appMod, authMod, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
    ]);
    FS = fs; AUTH = authMod;
    const app = appMod.initializeApp(firebaseConfig);
    auth = authMod.getAuth(app);
    db = fs.getFirestore(app);
    authMod.onAuthStateChanged(auth, u => {
      currentUser = u; uid = u ? u.uid : null;
      if(u && !nickname){ nickname = u.displayName || "משתמש"; localStorage.setItem("nickname", nickname); }
      updateWho(); updateCAs();
    });
    try { await authMod.getRedirectResult(auth); } catch(e){ console.warn("redirect:", e); }
    await loadAggregates();
  } catch(e){
    console.warn("Social init failed:", e);
  }
}

async function loadAggregates(){
  if(!db) return;
  try {
    const { collection, query, orderBy, limit, getDocs } = FS;
    const snap = await getDocs(query(collection(db,"series"), orderBy("likes","desc"), limit(60)));
    likesMap = new Map(); topList = [];
    snap.forEach(d => {
      const data = d.data();
      likesMap.set(d.id, data);
      if((data.likes||0) > 0) topList.push({ key:d.id, ...data });
    });
    renderView();
  } catch(e){ console.warn("loadAggregates:", e); }
}

function metaFor(key){
  // מציאת מטא-דאטה לסדרה מתוך הלוח (לכותרת/תמונה/ערוץ בעת לייק ראשון)
  const p = allPrograms.find(x => x.key === key) || (currentModal && currentModal.key === key ? currentModal : null);
  return p ? { title:p.title, channel:p.ch, img:p.img||null } : { title:key, channel:"reshet13", img:null };
}

async function toggleLike(key){
  if(!db) return;
  if(!await ensureSignedIn()) return;
  uid = auth.currentUser && auth.currentUser.uid;
  if(!uid) return;
  const { doc, collection, writeBatch, increment, serverTimestamp } = FS;
  const liked = likedSet.has(key);
  const m = metaFor(key);
  // עדכון אופטימי מיידי
  const agg = likesMap.get(key) || { likes:0, comments:0, ...m };
  agg.likes = Math.max(0, (agg.likes||0) + (liked ? -1 : 1));
  agg.title = m.title; agg.channel = m.channel; agg.img = m.img;
  likesMap.set(key, agg);
  if(liked) likedSet.delete(key); else likedSet.add(key);
  saveLiked(); refreshLikeUI(key); rebuildTop();

  try {
    const batch = writeBatch(db);
    const sref = doc(db,"series",key);
    const lref = doc(collection(db,"series",key,"likers"), uid);
    if(liked) batch.delete(lref);
    else batch.set(lref, { nickname, ts:serverTimestamp() });
    batch.set(sref, { title:m.title, channel:m.channel, img:m.img,
      likes:increment(liked?-1:1), updated:serverTimestamp() }, { merge:true });
    await batch.commit();
  } catch(e){ console.warn("toggleLike:", e); }
}

function rebuildTop(){
  topList = [...likesMap.entries()]
    .filter(([,v]) => (v.likes||0) > 0)
    .map(([key,v]) => ({ key, ...v }))
    .sort((a,b) => (b.likes||0) - (a.likes||0));
  renderView();
}

function refreshLikeUI(key){
  const agg = likesMap.get(key) || {};
  const liked = likedSet.has(key);
  document.querySelectorAll(`.likebtn[data-like="${cssEsc(key)}"]`).forEach(b => {
    b.classList.toggle("liked", liked);
    b.querySelector(".hrt").textContent = liked ? "♥" : "♡";
    b.querySelector(".cnt").textContent = agg.likes||0;
  });
  if(currentModal && currentModal.key === key){
    const ml = $("#mLike");
    if(ml){ ml.classList.toggle("liked", liked);
      ml.querySelector(".hrt").textContent = liked ? "♥" : "♡";
      $("#mLikeCnt").textContent = agg.likes||0; }
  }
}
function cssEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g,"\\$&"); }

/* comments */
function renderComments(){
  const box = $("#commentsBox");
  if(!SOCIAL){
    box.innerHTML = `<div class="cdisabled">תגובות ולייקים יופעלו לאחר הגדרת Firebase (ראה הוראות ב-README).</div>`;
    return;
  }
  const key = currentModal.key;
  box.innerHTML = `
    <h3>תגובות</h3>
    <div class="cbox">
      <textarea id="cText" maxlength="1000" placeholder="כתוב/כתבי תגובה…"></textarea>
      <div class="crow">
        <span class="as" id="cAs"></span>
        <button class="send" id="cSend">שליחה</button>
      </div>
    </div>
    <div class="clist" id="cList"><div class="cempty">טוען תגובות…</div></div>`;
  updateCAs();
  $("#cSend").onclick = () => sendComment(key);

  if(unsubComments){ unsubComments(); unsubComments = null; }
  const { collection, query, orderBy, limit, onSnapshot } = FS;
  const q = query(collection(db,"series",key,"comments"), orderBy("ts","desc"), limit(100));
  unsubComments = onSnapshot(q, snap => {
    const list = $("#cList"); if(!list) return;
    if(snap.empty){ list.innerHTML = `<div class="cempty">אין עדיין תגובות — היה/י הראשון/ה!</div>`; return; }
    const rows = [];
    snap.forEach(d => {
      const c = d.data();
      const t = c.ts && c.ts.toMillis ? relativeTime(c.ts.toMillis()) : "";
      rows.push(`<div class="citem"><div class="ch"><span class="cn">${esc(c.nickname||"אנונימי")}</span><span class="ct">${t}</span></div><div class="cx">${esc(c.text||"")}</div></div>`);
    });
    list.innerHTML = rows.join("");
  }, err => { const list = $("#cList"); if(list) list.innerHTML = `<div class="cempty">שגיאה בטעינת תגובות.</div>`; console.warn(err); });
}
function updateCAs(){
  const as = $("#cAs"); if(!as) return;
  if(currentUser){
    as.innerHTML = `כותב/ת בתור <b>${esc(nickname || currentUser.displayName || "משתמש")}</b> · <u>שנה</u>`;
    as.querySelector("u")?.addEventListener("click", async () => { await askNickname(true); updateCAs(); });
  } else {
    as.innerHTML = `<u>התחבר/י עם Google כדי להגיב</u>`;
    as.querySelector("u")?.addEventListener("click", () => signInGoogle());
  }
}
async function sendComment(key){
  const ta = $("#cText"); const text = ta.value.trim();
  if(!text) return;
  if(!await ensureSignedIn()){ return; }
  uid = auth.currentUser && auth.currentUser.uid;
  if(!uid) return;
  updateCAs();
  const btn = $("#cSend"); btn.disabled = true;
  try {
    const { doc, collection, writeBatch, increment, serverTimestamp } = FS;
    const m = metaFor(key);
    const batch = writeBatch(db);
    const cref = doc(collection(db,"series",key,"comments"));
    batch.set(cref, { nickname, uid, text, ts:serverTimestamp() });
    batch.set(doc(db,"series",key), { title:m.title, channel:m.channel, img:m.img,
      comments:increment(1), updated:serverTimestamp() }, { merge:true });
    await batch.commit();
    ta.value = "";
    const agg = likesMap.get(key) || { likes:0, comments:0 };
    agg.comments = (agg.comments||0) + 1; likesMap.set(key, agg);
    refreshCommentCounts(key);
  } catch(e){ console.warn("sendComment:", e); alert("שליחת התגובה נכשלה."); }
  btn.disabled = false;
}
function refreshCommentCounts(key){
  // עדכון מונה התגובות על הכרטיסים (רענון תצוגה פשוט)
  renderView();
}

initSocial();
</script>
</body>
</html>
