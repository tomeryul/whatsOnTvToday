<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מה עכשיו בטלוויזיה · 12 / 13 / 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414; --card:#1c1c1c; --red:#e50914;
    --ink:#fff; --muted:#b3b3b3; --line:#2a2a2a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Heebo",system-ui,sans-serif;min-height:100vh;line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  .topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 4vw;background:linear-gradient(180deg,#141414 30%,rgba(20,20,20,.85));
    border-bottom:1px solid var(--line);
  }
  .brand{color:var(--red);font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip-toggle{
    display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;cursor:pointer;
    font-weight:700;font-size:14px;user-select:none;border:1px solid var(--line);
    background:#1c1c1c;color:var(--muted);transition:.15s;
  }
  .chip-toggle .swatch{width:10px;height:10px;border-radius:50%}
  .chip-toggle.on{color:#fff;background:#2a2a2a;border-color:#444}
  .chip-toggle.off{opacity:.45}
  .spacer{flex:1}
  .updated{color:#777;font-size:12px;white-space:nowrap}
  .icon-btn{
    background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;
    width:38px;height:38px;border-radius:50%;font-size:18px;transition:.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.22)}
  .icon-btn:disabled{opacity:.4;cursor:default}
  .icon-btn.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #status{padding:0 4vw;font-size:14px;color:var(--muted)}
  #status.show{padding:16px 4vw}
  #status.err{color:#ff6b6b}

  #output{padding:8px 4vw 60px}
  .section{margin:14px 0 28px}
  .section > h2{
    font-size:clamp(18px,2.6vw,24px);font-weight:800;margin:0 0 14px;
    display:flex;align-items:center;gap:10px;
  }
  .section > h2 .sub{color:var(--muted);font-weight:600;font-size:14px}
  .live-dot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(229,9,20,.6)}
    70%{box-shadow:0 0 0 8px rgba(229,9,20,0)}
    100%{box-shadow:0 0 0 0 rgba(229,9,20,0)}
  }

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

  .pcard{
    display:flex;background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;
    position:relative;transition:transform .18s ease, background .18s ease;border:1px solid #242424;
  }
  .pcard:hover{transform:translateY(-3px);background:#242424}
  .pcard .pthumb{width:118px;min-width:118px;height:96px;object-fit:cover;background:#222;display:block}
  .pcard .pinfo{padding:10px 12px;min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
  .prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{
    font-size:12px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;line-height:1.6;
  }
  .ptime{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:#fff}
  .ptime .day{color:var(--muted);font-weight:600;font-size:12px}
  .nowtag{color:var(--red);font-weight:800;font-size:12px;display:flex;align-items:center;gap:4px}
  .nowtag .d{width:7px;height:7px;border-radius:50%;background:var(--red)}
  .ptitle{font-size:15px;font-weight:700;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pdesc{font-size:12.5px;color:var(--muted);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .pcard.live{border-color:var(--red)}
  .pprogress{position:absolute;bottom:0;right:0;height:3px;background:var(--red)}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;
    align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-overlay.open{display:flex}
  .modal{background:#181818;border-radius:12px;max-width:560px;width:100%;max-height:90vh;
    overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
  .modal .mimg{width:100%;height:280px;object-fit:cover;display:block;background:#222;border-radius:12px 12px 0 0}
  .modal .mclose{position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.65);color:#fff;border:none;font-size:20px;cursor:pointer;line-height:1}
  .modal .mclose:hover{background:#000}
  .modal .mbody{padding:20px 26px 28px}
  .modal .mchip{font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px}
  .modal h2{margin:12px 0 8px;font-size:26px;font-weight:900;line-height:1.1}
  .modal .mmeta{color:var(--muted);font-weight:600;margin-bottom:16px;font-size:15px}
  .modal .mmeta b{color:#fff}
  .modal .mdesc{color:#dcdcdc;font-size:15px;line-height:1.65;white-space:pre-wrap}
  .modal .mlink{display:inline-block;margin-top:20px;background:var(--red);color:#fff;font-weight:800;
    padding:11px 22px;border-radius:6px}
  .modal .mlink:hover{filter:brightness(1.1)}

  footer{margin-top:20px;color:#777;font-size:12px;text-align:center;line-height:1.7;padding:0 18px 30px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">מה עכשיו בטלוויזיה</div>
    <div class="chips" id="chips"></div>
    <div class="spacer"></div>
    <span class="updated" id="updated"></span>
    <button class="icon-btn" id="loadBtn" title="רענן">&#x21bb;</button>
  </div>

  <div id="status"></div>
  <div id="output"></div>

  <footer>
    כל הערוצים בדף אחד · עכשיו בשידור ו-24 השעות הקרובות · נתונים נמשכים בצד-שרת (GitHub Action).
  </footer>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="mclose" id="modalClose" title="סגור">&times;</button>
      <img class="mimg" id="modalImg" alt="" onerror="this.style.display='none'">
      <div class="mbody">
        <span class="mchip" id="modalChip"></span>
        <h2 id="modalTitle"></h2>
        <div class="mmeta" id="modalMeta"></div>
        <div class="mdesc" id="modalDesc"></div>
        <a class="mlink" id="modalLink" target="_blank" rel="noopener" style="display:none">עבור לעמוד התוכנית ↗</a>
      </div>
    </div>
  </div>

<script>
const CH = {
  reshet13: { id:"reshet13", file:"data/reshet13.json", name:"רשת 13", color:"#e50914", text:"#fff" },
  keshet12: { id:"keshet12", file:"data/keshet12.json", name:"קשת 12", color:"#3fd6c0", text:"#04201c" },
  kan11:    { id:"kan11",    file:"data/kan11.json",    name:"כאן 11", color:"#4da3ff", text:"#06182e" }
};
const ORDER = ["reshet13","keshet12","kan11"];
const HOUR = 3600e3, WINDOW = 24 * HOUR, DEFAULT_LEN = 90 * 60e3;

let allPrograms = [];                 // כל התוכניות מכל הערוצים (עם end ו-ch)
let windowed = [];                    // מה שמוצג כרגע (לשימוש המודאל)
const active = new Set(ORDER);        // ערוצים פעילים (כולם כברירת מחדל)

const $ = s => document.querySelector(s);
const statusEl = $("#status"), outEl = $("#output"), updatedEl = $("#updated");

function setStatus(msg, isErr){
  statusEl.textContent = msg || "";
  statusEl.className = (msg ? "show " : "") + (isErr ? "err" : "");
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function relativeTime(iso){
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if(isNaN(mins)) return "";
  if(mins < 1) return "עודכן הרגע";
  if(mins < 60) return `עודכן לפני ${mins} ד׳`;
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return `עודכן לפני ${hrs} ש׳`;
  return `עודכן לפני ${Math.round(hrs/24)} ימים`;
}

// "02:00" או "מחר 02:00" לפי היום של התוכנית
function timeLabel(start){
  const d = new Date(start), now = new Date();
  const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((dDay - day0) / 86400e3);
  const hhmm = new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  const prefix = diff <= 0 ? "" : diff === 1 ? "מחר " : "";
  return { prefix, hhmm };
}

/* ============ DATA ============ */

async function loadAll(){
  const btn = $("#loadBtn");
  btn.disabled = true; btn.classList.add("spin");
  setStatus("טוען לוח שידורים…");
  try {
    const loaded = await Promise.all(ORDER.map(async id => {
      try {
        const res = await fetch(CH[id].file + "?t=" + Date.now());
        if(!res.ok) throw 0;
        return await res.json();
      } catch { return null; }
    }));

    allPrograms = [];
    let oldest = null;
    loaded.forEach((json, i) => {
      if(!json || !json.programs) return;
      const id = ORDER[i];
      const progs = json.programs.slice().sort((a,b)=>a.start-b.start);
      progs.forEach((p, idx) => {
        const next = progs[idx+1];
        allPrograms.push({
          ...p, ch: id,
          end: next ? next.start : p.start + DEFAULT_LEN
        });
      });
      if(json.updated && (!oldest || json.updated < oldest)) oldest = json.updated;
    });

    if(!allPrograms.length){
      setStatus("אין נתונים זמינים. ייתכן שה-GitHub Action עוד לא יצר את הקבצים.", true);
    } else {
      setStatus("");
      updatedEl.textContent = oldest ? relativeTime(oldest) : "";
      renderView();
    }
  } catch(e){
    setStatus("שגיאה בטעינה: " + e.message, true);
  }
  btn.disabled = false; btn.classList.remove("spin");
}

/* ============ RENDER ============ */

function chip(id){
  const c = CH[id];
  return `<span class="chip" style="background:${c.color};color:${c.text}">${esc(c.name)}</span>`;
}

function pcard(p, idx){
  const isLive = p.start <= Date.now() && p.end > Date.now();
  const { prefix, hhmm } = timeLabel(p.start);
  let progress = "";
  if(isLive){
    const pct = Math.min(100, Math.max(0, (Date.now() - p.start) / (p.end - p.start) * 100));
    progress = `<span class="pprogress" style="width:${pct}%"></span>`;
  }
  return `<div class="pcard${isLive ? " live" : ""}" data-idx="${idx}">
    ${p.img
      ? `<img class="pthumb" src="${esc(p.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
      : `<span class="pthumb"></span>`}
    <div class="pinfo">
      <div class="prow">
        ${chip(p.ch)}
        <span class="ptime">${prefix ? `<span class="day">${prefix}</span>` : ""}${hhmm}</span>
        ${isLive ? `<span class="nowtag"><span class="d"></span>עכשיו</span>` : ""}
      </div>
      <div class="ptitle">${esc(p.title)}</div>
      ${p.desc ? `<div class="pdesc">${esc(p.desc)}</div>` : ""}
    </div>
    ${progress}
  </div>`;
}

function renderView(){
  const now = Date.now(), horizon = now + WINDOW;
  windowed = allPrograms
    .filter(p => active.has(p.ch) && p.end > now && p.start <= horizon)
    .sort((a,b) => a.start - b.start);

  if(!windowed.length){
    outEl.innerHTML = `<p style="color:#888;padding:30px 0">אין תוכניות להצגה (בדוק שהערוצים מסומנים למעלה).</p>`;
    return;
  }

  const live = [], upcoming = [];
  windowed.forEach((p, idx) => (p.start <= now ? live : upcoming).push(idx));

  let html = "";
  if(live.length){
    html += `<div class="section">
      <h2><span class="live-dot"></span>עכשיו בשידור</h2>
      <div class="grid">${live.map(i => pcard(windowed[i], i)).join("")}</div>
    </div>`;
  }
  if(upcoming.length){
    html += `<div class="section">
      <h2>בהמשך <span class="sub">· 24 השעות הקרובות</span></h2>
      <div class="grid">${upcoming.map(i => pcard(windowed[i], i)).join("")}</div>
    </div>`;
  }
  outEl.innerHTML = html;
}

/* ============ MODAL ============ */

function openModal(idx){
  const p = windowed[idx]; if(!p) return;
  const c = CH[p.ch];
  const { prefix, hhmm } = timeLabel(p.start);
  const chipEl = $("#modalChip");
  chipEl.textContent = c.name;
  chipEl.style.background = c.color; chipEl.style.color = c.text;
  $("#modalTitle").textContent = p.title;
  const endTxt = new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(p.end));
  $("#modalMeta").innerHTML = `<b>${prefix}${hhmm}–${endTxt}</b> · ${esc(c.name)}`;
  $("#modalDesc").textContent = p.desc || "אין תיאור זמין לתוכנית זו.";
  const img = $("#modalImg");
  if(p.img){ img.src = p.img; img.style.display = ""; } else { img.removeAttribute("src"); img.style.display = "none"; }
  const link = $("#modalLink");
  if(p.link){ link.href = p.link; link.style.display = ""; } else { link.style.display = "none"; }
  $("#modal").classList.add("open");
}
function closeModal(){ $("#modal").classList.remove("open"); }

$("#modalClose").onclick = closeModal;
$("#modal").onclick = e => { if(e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

outEl.addEventListener("click", e => {
  const card = e.target.closest(".pcard");
  if(card) openModal(+card.dataset.idx);
});

/* ============ CHANNEL CHIPS ============ */

function buildChips(){
  $("#chips").innerHTML = ORDER.map(id => {
    const c = CH[id];
    return `<div class="chip-toggle on" data-ch="${id}">
      <span class="swatch" style="background:${c.color}"></span>${esc(c.name)}
    </div>`;
  }).join("");
  $("#chips").querySelectorAll(".chip-toggle").forEach(el => el.onclick = () => {
    const id = el.dataset.ch;
    if(active.has(id) && active.size === 1) return; // לא לכבות את האחרון
    if(active.has(id)){ active.delete(id); el.classList.replace("on","off"); }
    else { active.add(id); el.classList.replace("off","on"); }
    renderView();
  });
}

$("#loadBtn").onclick = loadAll;
buildChips();
loadAll();
// רענון תצוגה כל דקה כדי שה"עכשיו בשידור" יישאר מדויק
setInterval(() => { if(allPrograms.length) renderView(); }, 60000);
</script>
</body>
</html>
