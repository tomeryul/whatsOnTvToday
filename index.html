<style>
  :root{ --bg:#141414; --card:#1c1c1c; --red:#e50914; --ink:#fff; --muted:#b3b3b3; --line:#2a2a2a;
    --glass:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.028));
    --glassbd:rgba(255,255,255,.13); --glasssh:0 8px 30px rgba(0,0,0,.34); }
  .blur{backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{color:var(--ink);font-family:"Heebo",system-ui,sans-serif;
    min-height:100vh;line-height:1.4;-webkit-font-smoothing:antialiased;background:transparent}

  /* רקע "אורורה" — כתמי צבע ענקיים שנעים לאט מאחורי כל האפליקציה */
  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;will-change:transform}
  .aurora .a1{width:64vmax;height:64vmax;top:-30vmax;right:-20vmax;
    background:radial-gradient(circle,rgba(229,9,20,.30),transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
  .aurora .a2{width:56vmax;height:56vmax;bottom:-32vmax;left:-18vmax;
    background:radial-gradient(circle,rgba(63,214,192,.17),transparent 62%);animation:drift2 33s ease-in-out infinite alternate}
  .aurora .a3{width:46vmax;height:46vmax;top:28%;left:52%;
    background:radial-gradient(circle,rgba(77,163,255,.14),transparent 62%);animation:drift3 39s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(-13vmax,11vmax) scale(1.18)}}
  @keyframes drift2{to{transform:translate(11vmax,-9vmax) scale(1.12)}}
  @keyframes drift3{to{transform:translate(-9vmax,-12vmax) scale(.88)}}
  @media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:10px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#444}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 4vw;padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:rgba(18,18,18,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.07)}
  .brand{color:var(--red);font-weight:900;font-size:22px;letter-spacing:-1px;white-space:nowrap;
    height:34px;width:130px;display:flex;align-items:center;overflow:hidden;flex-shrink:0}
  .brand svg{display:block}

  /* splash — אנימציית הלוגו בזמן טעינה ראשונית */
  #splash{position:fixed;inset:0;z-index:200;background:#0f2040;display:flex;align-items:center;justify-content:center;
    transition:opacity .55s ease;will-change:opacity}
  #splash.hide{opacity:0;pointer-events:none}
  #splashLogo{width:min(86vw,560px);aspect-ratio:1333 / 360}
  #splashLogo svg{display:block}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip-toggle{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;cursor:pointer;
    font-weight:700;font-size:14px;user-select:none;border:1px solid var(--glassbd);background:var(--glass);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--muted);transition:.15s}
  .chip-toggle .swatch{width:10px;height:10px;border-radius:50%}
  .chip-toggle.on{color:#fff;background:#2a2a2a;border-color:#444}
  .chip-toggle.on[data-ch="reshet13"]{background:rgba(229,9,20,.16);border-color:rgba(229,9,20,.55)}
  .chip-toggle.on[data-ch="keshet12"]{background:rgba(63,214,192,.14);border-color:rgba(63,214,192,.5)}
  .chip-toggle.on[data-ch="kan11"]{background:rgba(77,163,255,.16);border-color:rgba(77,163,255,.5)}
  .chip-toggle{transition:background .15s,border-color .15s,opacity .15s,transform .12s}
  .chip-toggle:active{transform:scale(.94)}
  .chip-toggle.off{opacity:.4}
  .vtabs{display:flex;gap:4px;background:var(--glass);border:1px solid var(--glassbd);border-radius:10px;padding:4px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .vtab{background:none;border:none;color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;
    padding:7px 14px;border-radius:7px;transition:.15s}
  .vtab:hover{color:#fff}
  .vtab.active{background:var(--red);color:#fff}
  .chips.hidden{display:none}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .who b{color:#fff}
  .who .lnk{cursor:pointer;text-decoration:underline}
  .who .lnk:hover{color:#fff}
  .avatar{width:24px;height:24px;border-radius:50%;object-fit:cover}
  .gbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;color:#1a1a1a;border:none;border-radius:8px;
    padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer}
  .gbtn:hover{filter:brightness(.93)}
  .gbtn .g{color:#4285F4;font-weight:900;font-size:15px}
  .updated{color:#777;font-size:12px;white-space:nowrap}
  .icon-btn{background:var(--glass);border:1px solid var(--glassbd);color:#fff;cursor:pointer;width:38px;height:38px;
    border-radius:50%;font-size:18px;transition:.15s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .icon-btn:hover{background:rgba(255,255,255,.22)}
  .icon-btn:disabled{opacity:.4;cursor:default}
  .icon-btn.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #status{padding:0 4vw;font-size:14px;color:var(--muted)}
  #status.show{padding:16px 4vw}
  #status.err{color:#ff6b6b}

  #output{padding:8px 4vw 60px}
  .section{margin:18px 0 30px}
  @keyframes sectionIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #output.intro .section,#output.intro .live-frame{animation:sectionIn .5s cubic-bezier(.2,.7,.2,1) both}
  #output.intro > :nth-child(2){animation-delay:.06s}
  #output.intro > :nth-child(3){animation-delay:.12s}
  #output.intro > :nth-child(4){animation-delay:.18s}
  #output.intro > :nth-child(5){animation-delay:.24s}
  .section > h2{font-size:clamp(18px,2.6vw,24px);font-weight:800;margin:0 0 15px;display:flex;align-items:center;gap:10px;
    padding-inline-start:13px;position:relative}
  .section > h2::before{content:"";position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);
    width:4px;height:1.05em;border-radius:3px;background:linear-gradient(var(--red),#7a060d)}
  .section > h2 .sub{color:var(--muted);font-weight:600;font-size:14px}
  .live-dot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
  .star{color:var(--accent,#ffd166)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,9,20,.6)}70%{box-shadow:0 0 0 8px rgba(229,9,20,0)}100%{box-shadow:0 0 0 0 rgba(229,9,20,0)}}

  /* ===== HERO BILLBOARD ===== */
  .hero{position:relative;margin:-8px -4vw 30px;min-height:clamp(330px,58vh,600px);display:flex;align-items:flex-end;
    background:#1a1a1a;overflow:hidden;isolation:isolate}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 22%;z-index:0;transform:scale(1.02)}
  .hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(to top,#141414 2%,rgba(20,20,20,.55) 38%,rgba(20,20,20,0) 78%),
               linear-gradient(to left,rgba(20,20,20,.92) 0%,rgba(20,20,20,.45) 42%,rgba(20,20,20,0) 80%)}
  .hero-content{position:relative;z-index:2;padding:clamp(22px,4.5vw,52px) clamp(20px,4vw,64px) clamp(30px,4vw,52px);max-width:680px}
  .hl-now{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:13px;letter-spacing:.4px;
    background:var(--red);padding:5px 12px;border-radius:5px;margin-bottom:16px}
  .hl-now .live-dot{width:9px;height:9px;background:#fff}
  .hero h1{font-size:clamp(30px,5.4vw,60px);font-weight:900;margin:0 0 14px;line-height:1.02;letter-spacing:-1.2px;
    text-shadow:0 3px 22px rgba(0,0,0,.55);text-wrap:balance}
  .hmeta{display:flex;align-items:center;gap:13px;color:#eaeaea;font-weight:700;font-size:15px;margin-bottom:14px;flex-wrap:wrap;
    font-variant-numeric:tabular-nums}
  .hdesc{color:#d4d4d4;font-size:clamp(14px,1.5vw,17px);line-height:1.55;margin:0 0 22px;max-width:580px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 10px rgba(0,0,0,.4)}
  .hbtns{display:flex;gap:12px;flex-wrap:wrap}
  .hbtn{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:16px;padding:12px 28px;border-radius:6px;
    cursor:pointer;border:none;transition:.15s;white-space:nowrap}
  .hbtn.primary{background:#fff;color:#141414}
  .hbtn.primary:hover{background:rgba(255,255,255,.78)}
  .hbtn.ghost{background:rgba(109,109,110,.55);color:#fff;backdrop-filter:blur(2px)}
  .hbtn.ghost:hover{background:rgba(109,109,110,.4)}
  .hprog{position:absolute;bottom:0;right:0;height:5px;background:var(--red);z-index:3}

  /* ===== LIVE NOW — מסגרת חמודה קומפקטית ===== */
  .live-frame::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    box-shadow:0 0 52px 5px rgba(229,9,20,.42);opacity:.35;animation:liveGlow 3s ease-in-out infinite}
  @keyframes liveGlow{50%{opacity:.85}}
  @media (prefers-reduced-motion:reduce){.live-frame::before{animation:none}}
  /* חשיפה בגלילה — כרטיסים נכנסים כשמגיעים אליהם */
  .rv{opacity:0;transform:translateY(22px) scale(.975)}
  .rv.in{opacity:1;transform:none;transition:opacity .5s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
  .live-frame{position:relative;margin:0 0 30px;padding:15px 17px 17px;border-radius:16px;
    background:linear-gradient(180deg,rgba(229,9,20,.16),rgba(255,255,255,.04) 60%,rgba(255,255,255,.02));
    border:1px solid rgba(229,9,20,.38);box-shadow:var(--glasssh);
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
  .lf-head{display:flex;align-items:center;gap:9px;margin-bottom:13px;font-weight:900;font-size:16px;letter-spacing:-.2px}
  .lf-head .live-dot{width:10px;height:10px}
  .lf-head .sub{color:var(--muted);font-weight:700;font-size:13px}
  .live-strip{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
  .lcard{display:flex;align-items:stretch;background:var(--glass);border-radius:12px;overflow:hidden;cursor:pointer;
    border:1px solid var(--glassbd);transition:background .15s,border-color .15s,transform .15s;position:relative;min-height:74px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  @media(hover:hover){.lcard:hover{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border-color:rgba(255,255,255,.22);transform:translateY(-2px)}}
  .lthumb-wrap{position:relative;width:112px;min-width:112px;overflow:hidden;
    background:linear-gradient(135deg,var(--c,#2a2a2a),#161616);display:flex;align-items:center;justify-content:center}
  .lthumb-wrap .ph-label{font-size:11px;padding:6px;line-height:1.15;font-weight:800}
  .lthumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
  .lthumb-wrap img.ld{opacity:1}
  .linfo{flex:1;min-width:0;padding:9px 12px;display:flex;flex-direction:column;gap:5px;justify-content:center}
  .lrow{display:flex;align-items:center;gap:8px}
  .ltime{font-size:12.5px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .ltitle{font-size:13.5px;font-weight:700;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lprog{position:absolute;bottom:0;right:0;height:3px;background:var(--red);z-index:2}

  /* ===== POSTER GRID (קומפקטי — יותר תוכניות במסך) ===== */
  .grid{display:grid;gap:20px 12px;grid-template-columns:repeat(auto-fill,minmax(184px,1fr))}

  .pcard{display:flex;flex-direction:column;background:var(--glass);border-radius:9px;cursor:pointer;position:relative;
    transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s,border-color .2s;border:1px solid var(--glassbd);
    box-shadow:0 2px 10px rgba(0,0,0,.22)}
  @media(hover:hover) and (pointer:fine){
    /* הטיה תלת-ממדית לכיוון הסמן + החזר-אור שזז (סטייל Apple TV) */
    .pcard:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.055);
      box-shadow:0 20px 44px rgba(0,0,0,.6);z-index:6;border-color:rgba(255,255,255,.3)}
    .pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .25s;
      pointer-events:none;z-index:7;
      background:radial-gradient(430px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.15),transparent 46%)}
    .pcard:hover::after{opacity:1}
  }
  @media(hover:none){
    .pcard:active{transform:scale(.965);transition-duration:.1s}
    .lcard:active{transform:scale(.97)}
  }
  .pthumb-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px 8px 0 0;
    background:linear-gradient(135deg,var(--c,#2a2a2a),#161616);display:flex;align-items:center;justify-content:center}
  .ph-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:12px;font-weight:900;font-size:clamp(14px,1.8vw,19px);color:rgba(255,255,255,.94);z-index:0;line-height:1.15;
    text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .pthumb{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .35s ease}
  .pthumb.ld{opacity:1}
  .bkbtn{position:absolute;top:7px;left:7px;z-index:3;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(0,0,0,.55);color:#ffd166;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:.15s;backdrop-filter:blur(2px)}
  .bkbtn:hover{background:rgba(0,0,0,.8);transform:scale(1.1)}
  .bkbtn.on{background:#ffd166;color:#3a2c00}
  .nowbadge{position:absolute;top:9px;right:9px;z-index:2;background:var(--red);color:#fff;font-weight:800;font-size:11px;
    letter-spacing:.3px;padding:3px 9px;border-radius:4px;display:flex;align-items:center;gap:5px}
  .nowbadge .d{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
  .pprogress{position:absolute;bottom:0;right:0;z-index:2;height:4px;background:var(--red)}
  .pcard .pinfo{padding:11px 13px 13px;min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:800;padding:2px 9px;border-radius:4px;white-space:nowrap;line-height:1.6}
  .ptime{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:#fff}
  .ptime .day{color:var(--muted);font-weight:600;font-size:12px}
  .ptitle{font-size:15.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pdesc{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pmeta{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:2px}
  .soon{color:#ffd166;font-weight:800;font-size:12px;white-space:nowrap}
  .lleft{color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap}
  .updated.stale{color:#ffb35c}

  /* next airings of the same series (modal) */
  .mnext{margin-top:16px}
  .mnext h4{margin:0 0 8px;font-size:14px;font-weight:800;color:#ddd}
  .mnext .nrow{display:flex;align-items:center;gap:10px;padding:8px 11px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:background .15s}
  .mnext .nrow:hover{background:rgba(255,255,255,.1)}
  .mnext .nt{font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
  .mnext .nt .day{color:var(--muted);font-weight:600;font-size:11.5px}

  /* ===== SPORT — thin lean rows ===== */
  .slist{display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.07);border-radius:12px;overflow:hidden;
    border:1px solid var(--glassbd);box-shadow:var(--glasssh);
    backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
  .srow{display:flex;align-items:center;gap:13px;padding:11px 16px;background:rgba(20,20,22,.55);transition:background .15s}
  .srow:hover{background:rgba(255,255,255,.07)}
  .stime{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:#fff;min-width:62px;flex-shrink:0;
    display:flex;align-items:baseline;gap:5px}
  .stime .day{color:var(--muted);font-weight:600;font-size:11.5px}
  .schip{position:relative;flex-shrink:0;width:104px;height:34px;display:flex;align-items:center;justify-content:center;
    background:#0e2017;border:1px solid #1f5638;border-radius:7px;overflow:hidden}
  .schip .sname{padding:5px 9px;font-size:11.5px;font-weight:800;color:#74e0a6;text-align:center;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .schip img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px 9px;background:#0e2017;
    opacity:0;transition:opacity .15s}
  .schip img.ld{opacity:1}
  .stitle{flex:1;min-width:0;font-size:14.5px;font-weight:600;color:#ececec;line-height:1.3}
  .slivetag{flex-shrink:0;color:#ff9248;font-weight:800;font-size:12px;white-space:nowrap}
  .snowtag{flex-shrink:0;color:#fff;background:var(--red);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:800;
    display:flex;align-items:center;gap:5px;white-space:nowrap}
  .snowtag .d{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
  @media(max-width:560px){
    .schip{width:74px;height:28px;padding:4px 6px;font-size:10px}
    .srow{gap:9px;padding:10px 12px}

<script type="module">
// טעינת הגדרות Firebase: קודם מקומי (GitHub Pages), ואם חסום (תצוגה מקדימה) — מהכתובת המתפרסמת.
let firebaseConfig = {};
try { ({ firebaseConfig } = await import("./firebase-config.js")); }
catch(e){
  try { ({ firebaseConfig } = await import("https://tomeryul.github.io/whatsOnTvToday/firebase-config.js")); }
  catch(e2){ firebaseConfig = {}; }
}

/* ===== מניעת זום לחלוטין (pinch / double-tap / ctrl+wheel / ctrl±) ===== */
["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
document.addEventListener("wheel", e => { if(e.ctrlKey) e.preventDefault(); }, { passive:false });
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault();
});
let _lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if(now - _lastTouchEnd <= 300) e.preventDefault(); // חוסם double-tap zoom
  _lastTouchEnd = now;
}, { passive:false });

/* ============ לוגו Lottie — splash + מותג ============ */
let _lottie;
async function getLottie(){
  if(_lottie !== undefined) return _lottie;
  try { _lottie = (await import("https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/+esm")).default; }
  catch(e){ _lottie = null; }
  return _lottie;
}
async function mountLogo(container, path, loop = true){
  if(!container) return null;
  const L = await getLottie();
  if(!L) return null;
  try { return L.loadAnimation({ container, renderer: "svg", loop, autoplay: true, path }); }
  catch(e){ return null; }
}
const SPLASH_MIN = 1300, _splashStart = Date.now();
let _splashGone = false;
function hideSplash(){
  if(_splashGone) return; _splashGone = true;
  const s = document.getElementById("splash");
  if(s){ s.classList.add("hide"); setTimeout(() => s.remove(), 650); }
}
function scheduleHideSplash(){ setTimeout(hideSplash, Math.max(0, SPLASH_MIN - (Date.now() - _splashStart))); }

/* ============ schedule data + UI ============ */
const CH = {
  reshet13: { id:"reshet13", file:"data/reshet13.json", name:"רשת 13", color:"#e50914", text:"#fff" },
  keshet12: { id:"keshet12", file:"data/keshet12.json", name:"קשת 12", color:"#3fd6c0", text:"#04201c" },
  kan11:    { id:"kan11",    file:"data/kan11.json",    name:"כאן 11", color:"#4da3ff", text:"#06182e" }
};
const ORDER = ["reshet13","keshet12","kan11"];
const HOUR = 3600e3, WINDOW = 24*HOUR, DEFAULT_LEN = 90*60e3;

let allPrograms = [], windowed = [], primeList = [], sportPrograms = [];
const active = new Set(ORDER);
let currentModal = null;        // {key,title,ch,img,desc,start,end,link}
let modalNexts = [];            // שידורים קרובים של אותה סדרה (למודאל)
let view = "tv";                // "tv" (ערוצים רגילים) או "sport"
let searchQuery = "", sportScores = [];
// ⭐ הרשימה שלי — סדרות מועדפות (נשמר מקומית בדפדפן)
const favSet = new Set(JSON.parse(localStorage.getItem("favKeys") || "[]"));
function saveFavs(){ localStorage.setItem("favKeys", JSON.stringify([...favSet])); }
function toggleFav(key){
  if(favSet.has(key)) favSet.delete(key); else favSet.add(key);
  saveFavs(); renderView();
  if(currentModal && currentModal.key === key){
    const b = $("#mFav");
    if(b){ const on = favSet.has(key);
      b.classList.toggle("faved", on);
      b.textContent = on ? "★ ברשימה שלי" : "☆ הוסף לרשימה"; }
  }
}

const $ = s => document.querySelector(s);
const statusEl = $("#status"), outEl = $("#output"), updatedEl = $("#updated");

function setStatus(msg, isErr){
  statusEl.textContent = msg || "";
  statusEl.className = (msg ? "show " : "") + (isErr ? "err" : "");
}
let _introT;
function introOnce(){ outEl.classList.add("intro"); clearTimeout(_introT); _introT = setTimeout(() => outEl.classList.remove("intro"), 1500); }

// חשיפה בגלילה — מה שכבר על המסך מוצג מיד; מה שמתחת לקו נכנס באנימציה כשמגיעים אליו
let revealIO = null;
function setupReveal(){
  if(revealIO){ revealIO.disconnect(); revealIO = null; }
  if(!("IntersectionObserver" in window)) return;
  const vh = window.innerHeight;
  const pending = [];
  outEl.querySelectorAll(".pcard,.lcard,.srow,.scard2").forEach(el => {
    if(el.getBoundingClientRect().top > vh + 30){ el.classList.add("rv"); pending.push(el); }
  });
  if(!pending.length) return;
  revealIO = new IntersectionObserver(entries => {
    entries.forEach((en, i) => {
      if(!en.isIntersecting) return;
      en.target.style.transitionDelay = (i % 6) * 45 + "ms";
      en.target.classList.add("in");
      revealIO.unobserve(en.target);
    });
  }, { rootMargin: "0px 0px -6% 0px" });
  pending.forEach(el => revealIO.observe(el));
}

// הטיה תלת-ממדית + החזר-אור לפי מיקום הסמן (דסקטופ בלבד)
if(window.matchMedia && matchMedia("(hover:hover) and (pointer:fine)").matches){
  let _tiltRaf = 0;
  outEl.addEventListener("pointermove", e => {
    const card = e.target.closest(".pcard");
    if(!card || _tiltRaf) return;
    _tiltRaf = requestAnimationFrame(() => {
      _tiltRaf = 0;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      card.style.setProperty("--rx", ((py - .5) * -7).toFixed(2) + "deg");
      card.style.setProperty("--ry", ((px - .5) * 9).toFixed(2) + "deg");
      card.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (py * 100).toFixed(1) + "%");
    });
  });
  outEl.addEventListener("pointerout", e => {
    const card = e.target.closest(".pcard");
    if(card){ card.style.removeProperty("--rx"); card.style.removeProperty("--ry"); }
  });
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function seriesKey(title){ return String(title).trim().replace(/\s+/g," ").replace(/\//g," ").slice(0,300); }

function relativeTime(ms){
  const mins = Math.round((Date.now() - ms) / 60000);
  if(isNaN(mins)) return "";
  if(mins < 1) return "עכשיו";
  if(mins < 60) return `לפני ${mins} ד׳`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `לפני ${hrs} ש׳`;
  return `לפני ${Math.round(hrs/24)} ימים`;
}
function timeLabel(start){
  const d = new Date(start), now = new Date();
  const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((dDay - day0) / 86400e3);
  const hhmm = new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  return { prefix: diff <= 0 ? "" : diff === 1 ? "מחר " : "", hhmm };
}

// טעינת JSON: קודם מהקובץ המקומי (GitHub Pages), ואם חסום (למשל בתצוגה מקדימה
// בארגז חול) — נפילה חזרה לכתובת המתפרסמת, כדי שתמיד יוצגו נתונים אמיתיים.
const DATA_FALLBACK = "https://tomeryul.github.io/whatsOnTvToday/";
async function fetchData(path){
  try { const r = await fetch(path, { cache:"no-store" }); if(r.ok) return await r.json(); } catch(e){}
  try { const r = await fetch(DATA_FALLBACK + path, { cache:"no-store" }); if(r.ok) return await r.json(); } catch(e){}
  return null;
}

// שלד טעינה — נראה כמו התוכן האמיתי בזמן שהנתונים בדרך
function skeletonHtml(){
  const card = `<div class="skel-card"><div class="skel skel-thumb"></div><div class="skel skel-line"></div><div class="skel skel-line short"></div></div>`;
  return `<div class="skel skel-frame"></div><div class="grid">${card.repeat(8)}</div>`;
}

async function loadAll(){
  const btn = $("#loadBtn");
  btn.disabled = true; btn.classList.add("spin");
  if(!allPrograms.length) outEl.innerHTML = skeletonHtml();
  setStatus("");
  try {
    const loaded = await Promise.all(ORDER.map(id => fetchData(CH[id].file)));
    // ספורט — קובץ נפרד (כל ערוצי ספורט 5 / ONE)
    const sportJson = await fetchData("data/sport.json");
    sportPrograms = (sportJson && sportJson.programs) ? sportJson.programs.slice().sort((a,b)=>a.start-b.start) : [];
    allPrograms = []; let oldest = null;
    loaded.forEach((json, i) => {
      if(!json || !json.programs) return;
      const id = ORDER[i];
      const progs = json.programs.slice().sort((a,b)=>a.start-b.start);
      progs.forEach((p, idx) => {
        allPrograms.push({ ...p, ch:id, key:seriesKey(p.title),
          end: progs[idx+1] ? progs[idx+1].start : p.start + DEFAULT_LEN });
      });
      const u = json.updated ? Date.parse(json.updated) : null;
      if(u && (!oldest || u < oldest)) oldest = u;
    });
    if(!allPrograms.length){
      outEl.innerHTML = "";
      setStatus("אין נתונים זמינים. ייתכן שה-GitHub Action עוד לא יצר את הקבצים.", true);
    } else {
      setStatus("");
      introOnce();
      updatedEl.textContent = oldest ? "עודכן " + relativeTime(oldest) : "";
      // נתונים בני 6+ שעות — סימון אזהרה עדין (ייתכן שה-cron של GitHub דילג)
      updatedEl.classList.toggle("stale", !!oldest && Date.now() - oldest > 6 * 3600e3);
      renderView();
    }
  } catch(e){ if(!allPrograms.length) outEl.innerHTML = ""; setStatus("שגיאה בטעינה: " + e.message, true); }
  btn.disabled = false; btn.classList.remove("spin");
  scheduleHideSplash();
}

function chip(id){ const c = CH[id]; return `<span class="chip" style="background:${c.color};color:${c.text}">${esc(c.name)}</span>`; }

function likeMetaHtml(key){
  if(!SOCIAL) return "";
  const agg = likesMap.get(key) || {};
  const liked = likedSet.has(key);
  return `<div class="pmeta">
    <button class="likebtn${liked?" liked":""}" data-like="${esc(key)}">
      <span class="hrt">${liked?"♥":"♡"}</span><span class="cnt">${agg.likes||0}</span>
    </button>
    <span class="cmeta">💬 <span>${agg.comments||0}</span></span>
  </div>`;
}

// כרטיס לייב קומפקטי — תמונה קטנה + שם, בתוך המסגרת החמודה
function liveCard(p, idx){
  const c = CH[p.ch] || { color:"#2a2a2a" };
  const { prefix, hhmm } = timeLabel(p.start);
  const pct = Math.min(100, Math.max(0, (Date.now()-p.start)/(p.end-p.start)*100));

function pcard(p, idx){
  const isLive = p.start <= Date.now() && p.end > Date.now();
  const { prefix, hhmm } = timeLabel(p.start);
  let badge = "", progress = "";
  if(isLive){
    const pct = Math.min(100, Math.max(0, (Date.now()-p.start)/(p.end-p.start)*100));
    badge = `<span class="nowbadge"><span class="d"></span>עכשיו</span>`;
    progress = `<span class="pprogress" style="width:${pct}%"></span>`;
  }
  const fav = favSet.has(p.key);
  const bk = `<button class="bkbtn${fav?" on":""}" data-fav="${esc(p.key)}" title="הרשימה שלי">${fav?"★":"☆"}</button>`;
  const inMin = Math.round((p.start - Date.now()) / 60000);
  const soon = (!isLive && inMin > 0 && inMin <= 60) ? `<span class="soon">בעוד ${inMin} ד׳</span>` : "";
  return `<div class="pcard${isLive?" live":""}" data-idx="${idx}">
    ${posterThumb(p.ch, p.img, p.title, badge + bk, progress)}
    <div class="pinfo">
      <div class="prow">${chip(p.ch)}<span class="ptime">${prefix?`<span class="day">${prefix}</span>`:""}${hhmm}</span>${soon}</div>
      <div class="ptitle">${esc(p.title)}</div>

}

// יעד "פריים טיים" — ה-21:40 הקרוב (היום אם עוד לא עבר, אחרת מחר)
const PRIME_H = 21, PRIME_M = 40;
function nextPrimeTarget(){
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), PRIME_H, PRIME_M, 0, 0);
  if(now.getTime() >= t.getTime()) t.setDate(t.getDate() + 1);
  return t.getTime();
}
function primeCard(p, idx, prefix){
  return `<div class="pcard" data-prime="${idx}">
    ${posterThumb(p.ch, p.img, p.title, "", "")}
    <div class="pinfo">
      <div class="prow">${chip(p.ch)}<span class="ptime"><span class="day">${prefix}</span>21:40</span></div>
      <div class="ptitle">${esc(p.title)}</div>
      ${p.desc ? `<div class="pdesc">${esc(p.desc)}</div>` : ""}
      ${likeMetaHtml(p.key)}
    </div>
  </div>`;
}

function renderView(){
  if(searchQuery){ renderSearch(); return; }
  if(view === "sport"){ renderSport(); return; }

  const now = Date.now(), horizon = now + WINDOW;
  windowed = allPrograms.filter(p => active.has(p.ch) && p.end > now && p.start <= horizon)
                        .sort((a,b)=>a.start-b.start);
  if(!windowed.length){
    outEl.innerHTML = `<p style="color:#888;padding:30px 0">אין תוכניות להצגה (בדוק שהערוצים מסומנים למעלה).</p>`;
    return;
  }
  const live = [], upcoming = [];
  windowed.forEach((p, idx) => (p.start <= now ? live : upcoming).push(idx));

  // מה בערב — איזו תוכנית משודרת בכל ערוץ ב-21:40 הקרוב
  const target = nextPrimeTarget();
  const primePrefix = new Date(target).toDateString() === new Date().toDateString() ? "היום " : "מחר ";
  primeList = ORDER.filter(id => active.has(id))
    .map(id => allPrograms.find(p => p.ch === id && p.start <= target && p.end > target))
    .filter(Boolean);

  let html = "";
  // עכשיו בלייב — מסגרת חמודה קומפקטית, למעלה
  if(live.length){
    html += `<div class="live-frame">
      <div class="lf-head"><span class="live-dot"></span>עכשיו בלייב <span class="sub">· ${live.length} ערוצים</span></div>
      <div class="live-strip">${live.map(i=>liveCard(windowed[i],i)).join("")}</div>
    </div>`;
  }
  // ⭐ הרשימה שלי — השידור הקרוב של כל סדרה מועדפת
  if(favSet.size){
    const seen = new Set(), favIdx = [];
    windowed.forEach((p, i) => {
      if(favSet.has(p.key) && !seen.has(p.key)){ seen.add(p.key); favIdx.push(i); }
    });
    if(favIdx.length){
      html += `<div class="section"><h2><span class="star">★</span>הרשימה שלי <span class="sub">· בקרוב אצלך</span></h2>
        <div class="grid">${favIdx.map(i=>pcard(windowed[i],i)).join("")}</div></div>`;
    }
  }
  if(primeList.length){
    html += `<div class="section"><h2>🌙 מה יש היום בערב <span class="sub">· ${primePrefix.trim()} 21:40</span></h2>
      <div class="grid">${primeList.map((p,i)=>primeCard(p,i,primePrefix)).join("")}</div></div>`;
  }
  if(SOCIAL && topList.length){
    html += `<div class="section"><h2><span class="star">★</span>הכי אהובים <span class="sub">· לפי המשתמשים</span></h2>
      <div class="grid">${topList.slice(0,12).map(topCard).join("")}</div></div>`;
  }
  if(upcoming.length){
    // פיצול לפי יום — "בהמשך היום" ו"מחר"
    const todayStr = new Date().toDateString();
    const todayIdx = [], tomIdx = [];
    upcoming.forEach(i => (new Date(windowed[i].start).toDateString() === todayStr ? todayIdx : tomIdx).push(i));
    if(todayIdx.length){
      html += `<div class="section"><h2>בהמשך היום</h2>
        <div class="grid">${todayIdx.map(i=>pcard(windowed[i],i)).join("")}</div></div>`;
    }
    if(tomIdx.length){
      html += `<div class="section"><h2>מחר <span class="sub">· עד השעה הזו</span></h2>
        <div class="grid">${tomIdx.map(i=>pcard(windowed[i],i)).join("")}</div></div>`;
    }
  }
  outEl.innerHTML = html;
  setupReveal();
}

// ===== תוצאות חיות מספורט 5 (ה-endpoint מחזיר CORS פתוח — נמשך ישירות מהדפדפן) =====
function stripHtml(s){ const d = document.createElement("div"); d.innerHTML = s; return (d.textContent || "").replace(/\s+/g," ").trim(); }
function parseScoreboard(h){
  const games = [];
  for(const b of (h.match(/<li[^>]*game_id[^>]*>[\s\S]*?<\/li>/g) || [])){
    const status = (b.match(/class="heading">[\s\S]*?title="([^"]*)"/) || [])[1] || "";
    const cls = (b.match(/class="score([^"]*)"/) || [])[1] || "";
    const teams = [...b.matchAll(/class="team-name"[^>]*>([\s\S]*?)<\/span>/g)].map(m => stripHtml(m[1]));
    const num = (b.match(/class="num"[^>]*>([\s\S]*?)<\/span>/) || [])[1] || "";
    if(teams.length === 2 && teams[0]){
      games.push({ status: stripHtml(status), live: /green/.test(cls), t1: teams[0], t2: teams[1], score: stripHtml(num) });
    }
  }
  return games;
}
async function fetchScores(){
  try {
    const r = await fetch("https://www.sport5.co.il/Ajax/GetLiveResults.aspx", { cache:"no-store" });
    if(r.ok) sportScores = parseScoreboard(await r.text());
  } catch(e){ /* התעלם — לא קריטי */ }
}
function scoreCard(g){
  return `<div class="scard2">
    <div class="sstatus"><span class="live-dot" style="width:8px;height:8px"></span>${esc(g.status)}</div>
    <div class="steams"><span class="tn">${esc(g.t1)}</span><span class="sc">${esc(g.score)}</span><span class="tn">${esc(g.t2)}</span></div>
  </div>`;
}

// ===== שיתוף תוכנית (Web Share, עם נפילה להעתקה ללוח) =====
async function shareProgram(p){
  const c = CH[p.ch];
  const when = p.start ? (() => { const { prefix, hhmm } = timeLabel(p.start); return ` · ${prefix}${hhmm}`; })() : "";
  const text = `📺 ${p.title} · ${(c && c.name) || ""}${when}\n${location.origin + location.pathname}`;
  try {
    if(navigator.share){ await navigator.share({ title: p.title, text }); return; }
    await navigator.clipboard.writeText(text);
    setStatus("הפרטים הועתקו ללוח ✓"); setTimeout(() => setStatus(""), 2500);
  } catch(e){ /* המשתמש ביטל — לא שגיאה */ }
}

// ===== תזכורת — הורדת אירוע יומן (.ics) עם התראה 10 דק' לפני =====
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsDownload(p){
  const fmt = ms => new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z$/,"Z");
  const end = p.end || (p.start + 3600e3);
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//whatsOnTv//HE//","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:wot-"+p.start+"-"+Math.random().toString(36).slice(2)+"@whatsontv",
    "DTSTAMP:"+fmt(Date.now()),"DTSTART:"+fmt(p.start),"DTEND:"+fmt(end),
    "SUMMARY:"+icsEsc(p.title),
    "LOCATION:"+icsEsc((CH[p.ch] && CH[p.ch].name) || ""),
    "DESCRIPTION:"+icsEsc(p.desc || ""),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(p.title),"TRIGGER:-PT10M","END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob = new Blob([ics], { type:"text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (p.title || "program").replace(/[^\w֐-׿]+/g,"_").slice(0,40) + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

  if(!row) return;
  const x = modalNexts[+row.dataset.n];
  if(x) openModal({ key:x.key, title:x.title, ch:x.ch, img:x.img, desc:x.desc, start:x.start, end:x.end, link:x.link });
});
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeModal(); closeNick(false); } });

/* ============ channel chips ============ */
function buildChips(){
  $("#chips").innerHTML = ORDER.map(id => {
    const c = CH[id];
    return `<div class="chip-toggle on" data-ch="${id}"><span class="swatch" style="background:${c.color}"></span>${esc(c.name)}</div>`;
  }).join("");
  $("#chips").querySelectorAll(".chip-toggle").forEach(el => el.onclick = () => {
    const id = el.dataset.ch;
    if(active.has(id) && active.size === 1) return;
    if(active.has(id)){ active.delete(id); el.classList.replace("on","off"); }
    else { active.add(id); el.classList.replace("off","on"); }
    renderView();
  });
}

// מעבר בין טאב טלוויזיה לטאב ספורט
$("#vtabs").querySelectorAll(".vtab").forEach(el => el.onclick = () => {
  if(el.classList.contains("active")) return;
  $("#vtabs").querySelectorAll(".vtab").forEach(x => x.classList.remove("active"));
  el.classList.add("active");
  view = el.dataset.view;
  history.replaceState(null, "", view === "sport" ? "?tab=sport" : location.pathname); // קישור עמוק
  $("#chips").classList.toggle("hidden", view !== "tv");   // צ'יפים רק בטלוויזיה
  outEl.scrollTo?.(0, 0); window.scrollTo(0, 0);
  introOnce();
  if(allPrograms.length || sportPrograms.length) renderView();
  if(view === "sport") fetchScores().then(() => { if(view === "sport") renderView(); });
});

$("#loadBtn").onclick = loadAll;

// חיפוש — פתיחת שורת החיפוש וסינון חי
$("#searchBtn").onclick = () => {
  const open = $("#searchbar").classList.toggle("open");
  $("#searchBtn").classList.toggle("active", open);
  if(open){ $("#searchInput").focus(); }
  else { searchQuery = ""; $("#searchInput").value = ""; renderView(); }
};
$("#searchInput").addEventListener("input", e => { searchQuery = e.target.value.trim(); renderView(); });
$("#searchClear").onclick = () => { searchQuery = ""; $("#searchInput").value = ""; $("#searchInput").focus(); renderView(); };

buildChips();
// קישור עמוק — פתיחה ישירה בטאב ספורט (?tab=sport)
if(new URLSearchParams(location.search).get("tab") === "sport"){
  view = "sport";
  $("#vtabs").querySelectorAll(".vtab").forEach(x => x.classList.toggle("active", x.dataset.view === "sport"));
  $("#chips").classList.add("hidden");
}
loadAll();
fetchScores();

// אנימציית הלוגו — מסך פתיחה (גרסה מלאה) + מותג בכותרת (גרסה שקופה)
mountLogo(document.getElementById("splashLogo"), "assets/whatsontv-logo.json");
mountLogo(document.getElementById("brand"), "assets/whatsontv-logo-mark.json").then(a => {
  if(a) a.addEventListener("DOMLoaded", () => {
    const b = document.getElementById("brand");
    if(b) [...b.childNodes].forEach(n => { if(n.nodeType === 3) n.remove(); });
  });
});
setTimeout(hideSplash, 4500); // בטיחות — שהספלאש לא ייתקע אם הטעינה נכשלת

// PWA — טעינה מהירה ועבודה אופליין (הנתונים האחרונים נשמרים במטמון)
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
setInterval(async () => {
  if(view === "sport") await fetchScores();
  if(allPrograms.length || sportPrograms.length) renderView();
}, 60000);

/* ============================================================
   SOCIAL — Firebase (משתמשים אנונימיים, כינוי, לייקים, תגובות)
   ============================================================ */
const SOCIAL = !!(firebaseConfig && firebaseConfig.apiKey);
let db = null, uid = null, FS = null, AUTH = null, auth = null, currentUser = null;
let likesMap = new Map();          // key -> {likes, comments, ...}
let topList = [];                  // series sorted by likes desc
let likedSet = new Set(JSON.parse(localStorage.getItem("likedKeys") || "[]"));
let nickname = localStorage.getItem("nickname") || "";
let unsubComments = null;

function saveLiked(){ localStorage.setItem("likedKeys", JSON.stringify([...likedSet])); }

function updateWho(){
  const el = $("#who");
  if(!SOCIAL){ el.textContent = ""; return; }
  if(currentUser){
    const name = esc(nickname || currentUser.displayName || "משתמש");
    el.innerHTML = `${currentUser.photoURL ? `<img class="avatar" src="${esc(currentUser.photoURL)}" alt="">` : ""}<b>${name}</b> · <u class="lnk" id="renameBtn">שם</u> · <u class="lnk" id="logoutBtn">יציאה</u>`;
    $("#renameBtn").onclick = () => askNickname(true);
    $("#logoutBtn").onclick = () => signOutUser();
  } else {
    el.innerHTML = `<button class="gbtn" id="gLogin"><span class="g">G</span> התחבר עם Google</button>`;
    $("#gLogin").onclick = () => signInGoogle();
  }
}

/* nickname dialog */
let nickResolve = null;
function askNickname(force){
  return new Promise(resolve => {
    if(nickname && !force){ resolve(nickname); return; }
    nickResolve = resolve;
    $("#nickInput").value = nickname || "";
    $("#nickModal").classList.add("open");
    setTimeout(()=>$("#nickInput").focus(), 50);
  });
}
function closeNick(saved){
  $("#nickModal").classList.remove("open");
  const r = nickResolve; nickResolve = null;
  if(r) r(saved ? nickname : (nickname || null));
}
$("#nickSave").onclick = () => {
  const v = $("#nickInput").value.trim().slice(0,24);
  if(!v) return;
  nickname = v; localStorage.setItem("nickname", v); updateWho(); updateCAs(); closeNick(true);
};
$("#nickCancel").onclick = () => closeNick(false);
$("#nickInput").addEventListener("keydown", e => { if(e.key === "Enter") $("#nickSave").click(); });

async function signInGoogle(){
  if(!auth || !AUTH) return false;
  const provider = new AUTH.GoogleAuthProvider();
  try {
    await AUTH.signInWithPopup(auth, provider);
    uid = auth.currentUser && auth.currentUser.uid;
    return true;
  } catch(e){
    // במובייל/חוסם-חלונות — נופלים להפניה (redirect)
    if(["auth/popup-blocked","auth/cancelled-popup-request","auth/popup-closed-by-user","auth/operation-not-supported-in-this-environment"].includes(e.code)){
      try { await AUTH.signInWithRedirect(auth, provider); } catch(_){}
    } else { console.warn("signIn:", e); alert("ההתחברות נכשלה: " + (e.code || e.message)); }
    return false;
  }
}
function signOutUser(){ if(auth && AUTH) AUTH.signOut(auth); }
async function ensureSignedIn(){ return currentUser ? true : await signInGoogle(); }

async function initSocial(){
  if(!SOCIAL){ updateWho(); return; }
  updateWho();
  try {
    const [appMod, authMod, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
    ]);
    FS = fs; AUTH = authMod;
    const app = appMod.initializeApp(firebaseConfig);
    auth = authMod.getAuth(app);
    db = fs.getFirestore(app);
    authMod.onAuthStateChanged(auth, u => {
      currentUser = u; uid = u ? u.uid : null;
      if(u && !nickname){ nickname = u.displayName || "משתמש"; localStorage.setItem("nickname", nickname); }
      updateWho(); updateCAs();
    });
    try { await authMod.getRedirectResult(auth); } catch(e){ console.warn("redirect:", e); }
    await loadAggregates();
  } catch(e){
    console.warn("Social init failed:", e);
  }
}

async function loadAggregates(){
  if(!db) return;
  try {
    const { collection, query, orderBy, limit, getDocs } = FS;
    const snap = await getDocs(query(collection(db,"series"), orderBy("likes","desc"), limit(60)));
    likesMap = new Map(); topList = [];
    snap.forEach(d => {
      const data = d.data();
      likesMap.set(d.id, data);
      if((data.likes||0) > 0) topList.push({ key:d.id, ...data });
    });
    renderView();
  } catch(e){ console.warn("loadAggregates:", e); }
}

function metaFor(key){
  // מציאת מטא-דאטה לסדרה מתוך הלוח (לכותרת/תמונה/ערוץ בעת לייק ראשון)
  const p = allPrograms.find(x => x.key === key) || (currentModal && currentModal.key === key ? currentModal : null);
  return p ? { title:p.title, channel:p.ch, img:p.img||null } : { title:key, channel:"reshet13", img:null };
}

async function toggleLike(key){
  if(!db) return;
  if(!await ensureSignedIn()) return;
  uid = auth.currentUser && auth.currentUser.uid;
  if(!uid) return;
  const { doc, collection, writeBatch, increment, serverTimestamp } = FS;
  const liked = likedSet.has(key);
  const m = metaFor(key);
  // עדכון אופטימי מיידי
  const agg = likesMap.get(key) || { likes:0, comments:0, ...m };
  agg.likes = Math.max(0, (agg.likes||0) + (liked ? -1 : 1));
  agg.title = m.title; agg.channel = m.channel; agg.img = m.img;
  likesMap.set(key, agg);
  if(liked) likedSet.delete(key); else likedSet.add(key);
  saveLiked(); refreshLikeUI(key); rebuildTop();

  try {
    const batch = writeBatch(db);
    const sref = doc(db,"series",key);
    const lref = doc(collection(db,"series",key,"likers"), uid);
    if(liked) batch.delete(lref);
    else batch.set(lref, { nickname, ts:serverTimestamp() });
    batch.set(sref, { title:m.title, channel:m.channel, img:m.img,
      likes:increment(liked?-1:1), updated:serverTimestamp() }, { merge:true });
    await batch.commit();
  } catch(e){ console.warn("toggleLike:", e); }
}

function rebuildTop(){
  topList = [...likesMap.entries()]
    .filter(([,v]) => (v.likes||0) > 0)
    .map(([key,v]) => ({ key, ...v }))
    .sort((a,b) => (b.likes||0) - (a.likes||0));
  renderView();
}

function refreshLikeUI(key){
  const agg = likesMap.get(key) || {};
  const liked = likedSet.has(key);
  document.querySelectorAll(`.likebtn[data-like="${cssEsc(key)}"]`).forEach(b => {
    b.classList.toggle("liked", liked);
    b.querySelector(".hrt").textContent = liked ? "♥" : "♡";
    b.querySelector(".cnt").textContent = agg.likes||0;
  });
  if(currentModal && currentModal.key === key){
    const ml = $("#mLike");
    if(ml){ ml.classList.toggle("liked", liked);
      ml.querySelector(".hrt").textContent = liked ? "♥" : "♡";
      $("#mLikeCnt").textContent = agg.likes||0; }
  }
}
function cssEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g,"\\$&"); }

/* comments */
function renderComments(){
  const box = $("#commentsBox");
  if(!SOCIAL){
    box.innerHTML = `<div class="cdisabled">תגובות ולייקים יופעלו לאחר הגדרת Firebase (ראה הוראות ב-README).</div>`;
    return;
  }
  const key = currentModal.key;
  const airId = currentModal.start ? key + "·" + currentModal.start : "";  // תגובות לפי שידור ספציפי
  box.innerHTML = `
    <h3>תגובות</h3>
    <div class="cbox">
      <textarea id="cText" maxlength="1000" placeholder="כתוב/כתבי תגובה…"></textarea>
      <div class="crow">
        <span class="as" id="cAs"></span>
        <button class="send" id="cSend">שליחה</button>
      </div>
    </div>
    <div class="clist" id="cList"><div class="cempty">טוען תגובות…</div></div>`;
  updateCAs();
  $("#cSend").onclick = () => sendComment(key, airId);

  if(unsubComments){ unsubComments(); unsubComments = null; }
  const { collection, query, orderBy, limit, onSnapshot } = FS;
  const q = query(collection(db,"series",key,"comments"), orderBy("ts","desc"), limit(300));
  unsubComments = onSnapshot(q, snap => {
    const list = $("#cList"); if(!list) return;
    // רק תגובות של אותו שידור (לפי השדה air); כך שתגובה על פרק לא מופיעה על האחרים
    const docs = snap.docs.filter(d => (d.data().air || "") === airId);
    if(!docs.length){ list.innerHTML = `<div class="cempty">אין עדיין תגובות — היה/י הראשון/ה!</div>`; return; }
    const rows = docs.map(d => {
      const c = d.data();
      const t = c.ts && c.ts.toMillis ? relativeTime(c.ts.toMillis()) : "";
      return `<div class="citem"><div class="ch"><span class="cn">${esc(c.nickname||"אנונימי")}</span><span class="ct">${t}</span></div><div class="cx">${esc(c.text||"")}</div></div>`;
    });
    list.innerHTML = rows.join("");
  }, err => { const list = $("#cList"); if(list) list.innerHTML = `<div class="cempty">שגיאה בטעינת תגובות.</div>`; console.warn(err); });
}
function updateCAs(){
  const as = $("#cAs"); if(!as) return;
  if(currentUser){
    as.innerHTML = `כותב/ת בתור <b>${esc(nickname || currentUser.displayName || "משתמש")}</b> · <u>שנה</u>`;
    as.querySelector("u")?.addEventListener("click", async () => { await askNickname(true); updateCAs(); });
  } else {
    as.innerHTML = `<u>התחבר/י עם Google כדי להגיב</u>`;
    as.querySelector("u")?.addEventListener("click", () => signInGoogle());
  }
}
async function sendComment(key, airId){
  const ta = $("#cText"); const text = ta.value.trim();
  if(!text) return;
  if(!await ensureSignedIn()){ return; }
  uid = auth.currentUser && auth.currentUser.uid;
  if(!uid) return;
  updateCAs();
  const btn = $("#cSend"); btn.disabled = true;
  try {
    const { doc, collection, writeBatch, increment, serverTimestamp } = FS;
    const m = metaFor(key);
    const batch = writeBatch(db);
    const cref = doc(collection(db,"series",key,"comments"));
    batch.set(cref, { nickname, uid, text, air: airId || "", ts:serverTimestamp() });
    batch.set(doc(db,"series",key), { title:m.title, channel:m.channel, img:m.img,
      comments:increment(1), updated:serverTimestamp() }, { merge:true });
    await batch.commit();
    ta.value = "";
    const agg = likesMap.get(key) || { likes:0, comments:0 };
    agg.comments = (agg.comments||0) + 1; likesMap.set(key, agg);
    refreshCommentCounts(key);
  } catch(e){ console.warn("sendComment:", e); alert("שליחת התגובה נכשלה."); }
  btn.disabled = false;
}
function refreshCommentCounts(key){
  // עדכון מונה התגובות על הכרטיסים (רענון תצוגה פשוט)
  renderView();
}

initSocial();
</script>
