<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח שידורים · ערוצים 12 / 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14; --panel:#15181f; --panel-2:#1b1f29;
    --ink:#eef1f6; --muted:#8b93a4; --line:#262b36;
    --c12:#3fd6c0; --c13:#ff5a4d; --accent:#ffd166;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(63,214,192,.08), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, rgba(255,90,77,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Heebo",system-ui,sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 18px 80px}
  header h1{
    font-family:"Frank Ruhl Libre",serif;
    font-weight:900;font-size:clamp(28px,6vw,46px);
    margin:0 0 4px;letter-spacing:-.5px;
  }
  header p{color:var(--muted);margin:0 0 22px;font-weight:300}
  header .bar{height:3px;width:120px;border-radius:3px;
    background:linear-gradient(90deg,var(--c12),var(--c13));margin-bottom:24px}

  .controls{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:22px;
    display:flex;flex-direction:column;gap:14px;
  }
  .tabs{display:flex;gap:8px}
  .tab{
    flex:1;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);padding:12px;border-radius:10px;text-align:center;
    font-weight:600;font-size:15px;transition:.18s;user-select:none;
  }
  .tab:hover{color:var(--ink)}
  .tab.active[data-ch="keshet12"]{color:#04201c;background:var(--c12);border-color:var(--c12)}
  .tab.active[data-ch="reshet13"]{color:#2a0a07;background:var(--c13);border-color:var(--c13)}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{flex:1;min-width:200px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input,select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;
  }
  input::placeholder{color:#5c6373}
  button.go{
    background:var(--accent);color:#221a00;border:none;border-radius:9px;
    padding:11px 22px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  button.go:hover{filter:brightness(1.08)}
  button.go:disabled{opacity:.5;cursor:default}

  .note{font-size:12.5px;color:var(--muted);line-height:1.6}
  .note b{color:var(--accent);font-weight:600}

  #status{margin:18px 0;font-size:14px;color:var(--muted);min-height:20px}
  #status.err{color:var(--c13)}

  .day{margin:26px 0 8px}
  .day h2{
    font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:20px;margin:0;
    display:flex;align-items:center;gap:10px;
  }
  .day h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}

  ul.list{list-style:none;margin:10px 0 0;padding:0;
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
  ul.list li{
    display:flex;gap:14px;align-items:center;padding:10px 16px;
    border-bottom:1px solid var(--line);transition:background .12s;
  }
  ul.list li:last-child{border-bottom:none}
  ul.list li:hover{background:var(--panel-2)}
  .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;
    color:var(--accent);min-width:52px;align-self:flex-start;padding-top:4px}
  .thumb{flex:0 0 auto;width:72px;height:46px;object-fit:cover;border-radius:8px;
    background:var(--panel-2);border:1px solid var(--line)}
  .thumb-empty{display:inline-block}
  .title a{color:var(--ink);text-decoration:none}
  .title a:hover{text-decoration:underline}
  .title{font-size:15px}

  footer{margin-top:40px;color:#5c6373;font-size:12px;text-align:center;line-height:1.7}
  code{background:var(--panel-2);padding:1px 6px;border-radius:5px;font-size:12px;color:var(--c12)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>לוח שידורים</h1>
    <p>ערוץ 12 (קשת) · ערוץ 13 (רשת) — משיכה חיה דרך פרוקסי CORS</p>
    <div class="bar"></div>
  </header>

  <div class="controls">
    <div class="tabs">
      <div class="tab active" data-ch="reshet13">רשת 13</div>
      <div class="tab" data-ch="keshet12">קשת 12</div>
    </div>

    <div class="row">
      <div class="field">
        <label>פרוקסי CORS</label>
        <select id="proxy">
          <option value="https://api.allorigins.win/raw?url=">allorigins.win (מומלץ)</option>
          <option value="https://corsproxy.io/?url=">corsproxy.io (לרוב לא עובד ל-13tv)</option>
          <option value="">ללא פרוקסי (רק אם הרצת מקומית עם CORS כבוי)</option>
        </select>
      </div>
      <button class="go" id="loadBtn">טען לוח</button>
    </div>

    <div class="field" id="makoField" style="display:none">
      <label>endpoint של קשת 12 (אופציונלי — נשאר ריק והלוח נטען אוטומטית)</label>
      <input id="makoUrl" placeholder="ברירת מחדל: /AjaxPage?jspName=EPGResponse.jsp — מלא רק כדי לעקוף">
    </div>

    <p class="note" id="hint"></p>
  </div>

  <div id="status"></div>
  <div id="output"></div>

  <footer>
    דף לקוח בלבד · אין API רשמי לערוצים.<br>
    רשת 13 נמשך מה-JSON המוטמע בעמוד · קשת 12 נמשך מ-endpoint ה-EPG של mako.<br>
    שני הערוצים עובדים מהקופסה — אם פרוקסי אחד נכשל, נסה אחר מהרשימה.
  </footer>
</div>

<script>
const SOURCES = {
  reshet13: "https://13tv.co.il/tv-guide/",
  // ה-endpoint שמאחורי לוח השידורים של mako (קשת 12) — מחזיר JSON של כל השבוע
  keshet12: "https://www.mako.co.il/AjaxPage?jspName=EPGResponse.jsp"
};
let channel = "reshet13";

const $ = s => document.querySelector(s);
const proxyEl = $("#proxy"), statusEl = $("#status"), outEl = $("#output");
const makoField = $("#makoField"), hintEl = $("#hint");

const HINTS = {
  reshet13: "רשת 13 עובד מהקופסה — לחץ <b>טען לוח</b>. הלוח (כל השבוע) מחולץ ישירות מה-JSON של האתר.",
  keshet12: "קשת 12 עובד מהקופסה — לחץ <b>טען לוח</b>. הלוח נמשך מה-endpoint של mako (EPGResponse). אפשר להחליף endpoint ידנית בשדה למטה במקרה הצורך."
};

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  channel = t.dataset.ch;
  makoField.style.display = channel === "keshet12" ? "block" : "none";
  hintEl.innerHTML = HINTS[channel];
  outEl.innerHTML = ""; statusEl.textContent = ""; statusEl.className = "";
});
hintEl.innerHTML = HINTS[channel];

function setStatus(msg, isErr){ statusEl.textContent = msg; statusEl.className = isErr ? "err" : ""; }

async function fetchText(url){
  const proxy = proxyEl.value;
  const full = proxy ? proxy + encodeURIComponent(url) : url;
  const res = await fetch(full);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.text();
}

// חילוץ פריטי לוח מ-13tv. המבנה הנוכחי הוא אפליקציית Next.js — הלוח (כל השבוע)
// יושב כ-JSON בתוך תגית <script id="__NEXT_DATA__">. נפרסר אותו ישירות.
function parseReshet(html){
  const m = html.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);
  if(m){
    try {
      const data = JSON.parse(m[1]);
      const grids = data?.props?.pageProps?.page?.Content?.PageGrid || [];
      const days = [];
      grids.forEach(grid => {
        (grid.broadcastWeek || []).forEach(day => {
          const items = (day.shows || [])
            .filter(s => s.start_time && s.title && !s.isBlank)
            .map(s => ({
              time: s.start_time,
              title: String(s.title).trim(),
              link: s.link || null,
              img: s.image || (s.imageObj && s.imageObj.d) || null
            }));
          if(items.length){
            const label = [day.weekday, day.shortDate].filter(Boolean).join(" · ");
            days.push({ label, items });
          }
        });
      });
      if(days.length) return days;
    } catch(e){ /* אם המבנה השתנה — ניפול לפרסר ה-HTML הישן */ }
  }
  return parseReshetLegacy(html);
}

// פרסר HTML ישן — גיבוי למקרה שמבנה ה-JSON ישתנה שוב. מקטלג לימים לפי איפוס שעה.
function parseReshetLegacy(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const items = [];
  doc.querySelectorAll("a").forEach(a => {
    const txt = a.textContent.trim().replace(/\s+/g, " ");
    const m = txt.match(/^(\d{1,2}:\d{2})\s+(.+)/);
    if(m){
      const title = m[2].split(">>")[0].trim();
      if(title) items.push({ time: m[1], title, link: a.getAttribute("href") });
    }
  });
  // הסרת כפילויות עוקבות
  const clean = items.filter((it,i) =>
    i === 0 || it.time !== items[i-1].time || it.title !== items[i-1].title);
  // קיבוץ לימים: כשהשעה "קופצת אחורה" מתחיל יום חדש
  const days = []; let cur = null, prev = -1;
  for(const it of clean){
    const mins = (+it.time.split(":")[0]) * 60 + (+it.time.split(":")[1]);
    if(!cur || mins < prev - 120){ cur = []; days.push(cur); }
    cur.push(it); prev = mins;
  }
  return days;
}

// חילוץ פריטי לוח מ-mako (קשת 12). ה-endpoint מחזיר JSON עם programs[],
// כל פריט מכיל DisplayStartTime, ProgramName ו-Date (DD/MM/YYYY HH:MM:SS).
// מקבצים לפי התאריך ומחשבים שם יום בעברית.
function parseMako(raw){
  const data = typeof raw === "string" ? JSON.parse(raw) : raw;
  const progs = data.programs || [];
  const HEB_DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const days = []; let curKey = null, cur = null;
  progs.forEach(p => {
    const time = p.DisplayStartTime, title = (p.ProgramName || "").trim();
    if(!time || !title) return;
    const datePart = (p.Date || "").split(" ")[0]; // DD/MM/YYYY
    if(datePart !== curKey){
      curKey = datePart;
      let label = datePart;
      const dm = datePart.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if(dm){
        const dt = new Date(+dm[3], +dm[2]-1, +dm[1]);
        label = HEB_DAYS[dt.getDay()] + " · " + dm[1] + "." + dm[2];
      }
      cur = { label, items: [] }; days.push(cur);
    }
    const url = (p.MakoTVURL || "").trim();
    const pic = (p.Picture || "").trim();
    cur.items.push({
      time, title,
      link: url.startsWith("http") ? url : null,
      img: pic && !/placeholder/i.test(pic) ? pic : null
    });
  });
  return days;
}

function render(days){
  if(!days.length){ setStatus("לא נמצאו פריטי לוח בתשובה — נסה פרוקסי אחר מהרשימה (allorigins.win).", true); return false; }
  const fallbackLabels = ["היום","מחר","יום 3","יום 4","יום 5","יום 6","יום 7","יום 8"];
  outEl.innerHTML = days.map((day, di) => {
    // תמיכה בשני המבנים: {label, items} מהפרסר החדש, או מערך פריטים מהפרסר הישן
    const items = Array.isArray(day) ? day : day.items;
    const label = (!Array.isArray(day) && day.label) || fallbackLabels[di] || ("יום " + (di+1));
    return `
    <div class="day"><h2>${esc(label)}</h2></div>
    <ul class="list">
      ${items.map(it => `
        <li>
          <span class="time">${it.time}</span>
          ${it.img
            ? `<img class="thumb" src="${esc(it.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
            : `<span class="thumb thumb-empty"></span>`}
          <span class="title">${it.link
            ? `<a href="${it.link.startsWith("http") ? it.link : "https://13tv.co.il"+it.link}" target="_blank" rel="noopener">${esc(it.title)}</a>`
            : esc(it.title)}</span>
        </li>`).join("")}
    </ul>`;
  }).join("");
  return true;
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("#loadBtn").onclick = async () => {
  const btn = $("#loadBtn");
  btn.disabled = true; outEl.innerHTML = "";
  try {
    if(channel === "reshet13"){
      setStatus("מושך מ-13tv.co.il …");
      const html = await fetchText(SOURCES.reshet13);
      if(render(parseReshet(html))) setStatus("נטען ✓");
    } else {
      // endpoint ברירת-מחדל של mako, או override ידני אם הוזן
      const ep = $("#makoUrl").value.trim() || SOURCES.keshet12;
      setStatus("מושך מ-mako …");
      const raw = await fetchText(ep);
      try {
        if(render(parseMako(raw))) setStatus("נטען ✓");
      } catch(e) {
        // אם לא הצליח לפרסר — נציג את הגולמי כדי לאבחן
        outEl.innerHTML = `<ul class="list"><li><span class="title">
          לא הצלחתי לפרסר את התשובה מ-mako (${esc(e.message)}). הנה ההתחלה הגולמית:<br><br>
          <code style="white-space:pre-wrap;display:block">${esc(raw.slice(0,800))}</code>
          </span></li></ul>`;
        setStatus("התקבלה תשובה לא-צפויה מ-mako — נסה פרוקסי אחר.", true);
      }
    }
  } catch(e){
    setStatus("שגיאה: " + e.message + " — נסה פרוקסי אחר מהרשימה.", true);
  }
  btn.disabled = false;
};
</script>
</body>
</html>
